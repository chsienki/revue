<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>revue</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" />
<script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --radius: 4px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }

  /* Dark theme */
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #1e1e1e;
    --bg2: #252526;
    --bg3: #2d2d30;
    --border: #3c3c3c;
    --text: #cccccc;
    --text-dim: #858585;
    --accent: #007acc;
    --accent2: #0e639c;
    --add: #1a3a1a;
    --del: #3a1a1a;
    --add-line: #1a3a1a;
    --del-line: #3a1a1a;
    --add-word: #2ea04366;
    --del-word: #f4717466;
    --comment-bg: #3a3200;
    --comment-border: #cca700;
    --comment-text: #cccccc;
    --warning-bg: #3a3200;
    --warning-border: #cca700;
    --warning-text: #e0c060;
    --info-bg: #0e2a47;
    --info-border: #007acc;
    --info-text: #6cb6ff;
    --ok: #3fb950;
    --ok-dim: #2d7a38;
  }

  /* Light theme — GitHub-inspired clean white */
  [data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --bg2: #f0f2f5;
    --bg3: #e2e6eb;
    --border: #b0b8c4;
    --text: #1a1a1a;
    --text-dim: #4d5562;
    --accent: #0969da;
    --accent2: #ddf4ff;
    --add: #d1f7d6;
    --del: #ffdce0;
    --add-line: #bcf0c4;
    --del-line: #ffc8ce;
    --add-word: #7ee89a;
    --del-word: #ff818266;
    --comment-bg: #fef3cd;
    --comment-border: #c69500;
    --comment-text: #1a1a1a;
    --warning-bg: #fff8e1;
    --warning-border: #c69500;
    --warning-text: #6d5300;
    --info-bg: #ddf4ff;
    --info-border: #0969da;
    --info-text: #0550ae;
    --ok: #1a7f37;
    --ok-dim: #7bc98a;
  }

  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 0.8125rem; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Stale ref warning banner */
  #stale-banner {
    display: none;
    background: var(--warning-bg);
    border-bottom: 1px solid var(--warning-border);
    color: var(--warning-text);
    padding: 6px 12px;
    font-size: 0.8125rem;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #stale-banner.active { display: flex; }
  #stale-banner .stale-icon { font-size: 1rem; }
  #stale-banner .stale-msg { flex: 1; }
  #stale-banner button {
    background: var(--warning-border);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 3px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8125rem;
  }
  #stale-banner button:hover { opacity: 0.85; }
  #stale-banner button:disabled { opacity: 0.5; cursor: default; }
  #stale-banner .dismiss-btn {
    background: transparent;
    color: var(--warning-text);
    font-size: 1rem;
    padding: 0 4px;
  }

  #update-banner {
    display: none;
    background: var(--info-bg);
    border-bottom: 1px solid var(--info-border);
    color: var(--info-text);
    padding: 6px 12px;
    font-size: 0.8125rem;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #update-banner.active { display: flex; }
  #update-banner .update-msg { flex: 1; }
  #update-banner #update-restart-btn {
    background: var(--info-border);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 3px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8125rem;
  }
  #update-banner #update-restart-btn:hover { opacity: 0.85; }
  #update-banner #update-restart-btn:disabled { opacity: 0.6; cursor: default; }
  #update-banner code {
    background: var(--info-border);
    color: #fff;
    padding: 1px 6px;
    border-radius: var(--radius);
    font-family: var(--mono);
    font-size: 0.75rem;
  }
  #update-banner .dismiss-btn {
    background: transparent;
    color: var(--info-text);
    font-size: 1rem;
    padding: 0 4px;
    border: none;
    cursor: pointer;
  }

  #changes-banner {
    display: none;
    background: var(--info-bg);
    border-bottom: 1px solid var(--info-border);
    color: var(--info-text);
    padding: 6px 12px;
    font-size: 0.8125rem;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #changes-banner.active { display: flex; }
  #changes-banner .update-msg { flex: 1; }
  #changes-banner button {
    background: var(--info-border);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 3px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8125rem;
  }
  #changes-banner button:hover { opacity: 0.85; }
  #changes-banner .dismiss-btn {
    background: transparent;
    color: var(--info-text);
    font-size: 1rem;
    padding: 0 4px;
  }

  /* Top bar */
  #topbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
    font-size: 0.9375rem;
    line-height: 1;
  }
  #topbar .logo-icon { font-size: 1.125rem; }
  #topbar .logo { font-weight: 700; font-size: 1.125rem; color: var(--text); letter-spacing: 0.5px; white-space: nowrap; }
  #topbar label { color: var(--text-dim); }
  #topbar select {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px 6px;
    font-size: 0.875rem;
    cursor: pointer;
    max-width: 220px;
  }
  #topbar select:focus { outline: 1px solid var(--accent); }
  .arrow { color: var(--text-dim); font-size: 0.9375rem; }
  .topbar-group { display: flex; align-items: baseline; gap: 6px; }
  .topbar-spacer { flex: 1; }

  /* Repo selector */
  #repo-wrapper { position: relative; display: flex; align-items: baseline; }
  #repo-btn {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px 8px;
    font-size: 0.875rem;
    font-family: inherit;
    line-height: normal;
    cursor: pointer;
    max-width: 240px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #repo-btn:hover { border-color: var(--accent); }
  #repo-current { font-weight: 600; }
  #repo-panel {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 2px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 100;
    min-width: 240px;
    max-width: 520px;
    max-height: 320px;
    overflow-y: auto;
    box-shadow: 0 4px 16px #0008;
  }
  #repo-panel.open { display: block; }
  .repo-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 0.8125rem;
  }
  .repo-row:last-child { border-bottom: none; }
  .repo-row:hover { background: var(--bg3); }
  .repo-row.active { background: var(--accent2); }
  .repo-name {
    flex: 1;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .repo-remove {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
    border-radius: var(--radius);
  }
  .repo-remove:hover { color: var(--text); background: var(--del); }

  /* Commits dropdown */
  #commits-btn {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px 6px;
    font-size: 0.875rem;
    font-family: inherit;
    line-height: normal;
    cursor: pointer;
  }
  #commits-btn:hover { border-color: var(--accent); }
  #commits-btn.range-active { border-color: var(--accent); background: var(--accent2); }
  #commit-range-label {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--accent);
    display: none;
    align-items: center;
    gap: 4px;
  }
  #commit-range-label.active { display: flex; }
  #commit-range-label .range-clear {
    cursor: pointer;
    color: var(--text-dim);
    font-size: 0.875rem;
    margin-left: 2px;
  }
  #commit-range-label .range-clear:hover { color: #fff; }
  #commits-panel {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 100;
    min-width: 480px;
    max-height: 320px;
    overflow-y: auto;
    box-shadow: 0 4px 16px #0008;
  }
  #commits-wrapper { position: relative; display: flex; align-items: baseline; gap: 6px; }
  #commits-panel.open { display: block; }
  .commit-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 0.75rem;
    user-select: none;
  }
  .commit-row:hover { background: var(--bg3); }
  .commit-row.selected { background: var(--accent2); }
  .commit-row.in-range { background: rgba(88, 166, 255, 0.1); }
  .commit-hash { font-family: var(--mono); color: var(--accent); min-width: 60px; }
  .commit-subject { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .commit-author { color: var(--text-dim); min-width: 80px; text-align: right; }
  #commit-range-hint { padding: 6px 10px; font-size: 0.6875rem; color: var(--text-dim); border-bottom: 1px solid var(--border); }

  /* Settings dropdown */
  #settings-wrapper { position: relative; }
  #settings-btn {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px 6px;
    font-size: 0.875rem;
    font-family: inherit;
    line-height: normal;
    cursor: pointer;
  }
  #settings-btn:hover { border-color: var(--accent); }
  #settings-panel {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 100;
    min-width: 220px;
    padding: 8px 0;
    box-shadow: 0 4px 16px #0008;
  }
  #settings-panel.open { display: block; }
  .settings-item {
    padding: 6px 12px;
    font-size: 0.8125rem;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .settings-item:hover { background: var(--bg3); }
  .settings-item label { cursor: pointer; flex: 1; }
  .settings-item input, .settings-item select { cursor: pointer; }
  .settings-version { font-size: 0.6875rem; color: var(--text-dim); font-family: var(--mono); cursor: default; border-top: 1px solid var(--border); }
  .settings-version:hover { background: inherit; }

  /* Main layout */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* File list */
  #filelist {
    width: 260px;
    min-width: 120px;
    max-width: 50vw;
    flex-shrink: 0;
    background: var(--bg2);
    border-right: none;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  #filelist-resize {
    position: absolute;
    top: 0;
    right: 0;
    width: 4px;
    height: 100%;
    cursor: col-resize;
    background: var(--border);
    z-index: 10;
    transition: background 0.15s;
  }
  #filelist-resize:hover, #filelist-resize.dragging { background: var(--accent); }
  #filelist-header {
    padding: 8px 10px;
    font-size: 0.6875rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .file-item {
    padding: 4px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .file-item:hover { background: var(--bg3); }
  .file-item.active { background: var(--accent2); }
  .file-name { flex: 1; font-family: var(--mono); font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-stats { font-size: 0.6875rem; white-space: nowrap; }
  .folder-row {
    padding: 5px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text);
    font-weight: 600;
    user-select: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: var(--bg2);
  }
  .folder-row:hover { background: var(--bg3); }
  .folder-row .folder-arrow { font-size: 0.625rem; width: 12px; display: inline-block; transition: transform 0.15s; }
  .folder-row.collapsed .folder-arrow { transform: rotate(-90deg); }
  .folder-children { }
  .folder-children.hidden { display: none; }
  .folder-children .file-item { }
  .stat-add { color: #4ec94e; }
  .stat-del { color: #f47174; }
  .comment-badge {
    background: var(--comment-border);
    color: #000;
    border-radius: 10px;
    padding: 0 5px;
    font-size: 0.625rem;
    font-weight: 700;
  }
  .comment-badge.clickable { cursor: pointer; }
  .comment-badge.clickable:hover { box-shadow: 0 0 0 2px var(--accent); }

  /* Comment jump picker -- opened from a file-list comment badge */
  .comment-jump-menu {
    position: fixed;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 200;
    min-width: 240px;
    max-width: 440px;
    max-height: 320px;
    overflow-y: auto;
    box-shadow: 0 4px 16px #0008;
    padding: 4px 0;
  }
  .comment-jump-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 0.75rem;
    user-select: none;
  }
  .comment-jump-item:hover { background: var(--bg3); }
  .comment-jump-item.resolved { opacity: 0.55; }
  .comment-jump-line { font-family: var(--mono); color: var(--accent); flex-shrink: 0; }
  .comment-jump-author { flex-shrink: 0; }
  .comment-jump-preview { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }

  @keyframes revue-comment-flash-kf {
    0%   { box-shadow: 0 0 0 2px var(--accent), 0 0 14px 3px var(--accent); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .revue-comment-flash { animation: revue-comment-flash-kf 1.5s ease-out; }

  /* Diff viewer */
  #diffview {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
    position: relative;
  }
  #diffview > *:not(#loading-overlay) { margin: 0; }
  #diffview-content > * { margin: 12px; }
  .window-control {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 12px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-size: 0.8125rem;
    background: var(--bg2);
  }
  .window-control button {
    font: inherit;
    font-family: inherit;
    line-height: normal;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 10px;
    cursor: pointer;
  }
  .window-control button:hover { border-color: var(--accent); color: var(--accent); }
  .window-control .window-count { font-family: var(--mono); font-size: 0.75rem; }
  #diffview-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    font-size: 0.9375rem;
  }
  #loading-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(30, 30, 46, 0.7);
    z-index: 50;
    align-items: center;
    justify-content: center;
    font-size: 0.9375rem;
    color: var(--text-dim);
  }
  #loading-overlay.active { display: flex; }
  .spinner { 
    width: 20px; height: 20px; 
    border: 2px solid var(--border); 
    border-top-color: var(--accent); 
    border-radius: 50%; 
    animation: spin 0.6s linear infinite; 
    margin-right: 10px; 
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* diff2html overrides for dark theme */
  .d2h-wrapper { font-family: var(--mono) !important; font-size: 0.75rem !important; }
  .d2h-file-header { background: var(--bg2) !important; border-color: var(--border) !important; color: var(--text) !important; position: sticky !important; top: 0 !important; z-index: 20 !important; }
  .d2h-file-wrapper { border-color: var(--border) !important; border-radius: var(--radius) !important; }
  .d2h-file-diff { position: relative; z-index: 1; background: var(--bg) !important; container-type: inline-size !important; }
  .d2h-diff-table { background: transparent !important; border-collapse: separate !important; border-spacing: 0 !important; min-width: 100% !important; }
  .d2h-diff-table tr, .d2h-diff-table td, .d2h-diff-table tbody { border: none !important; }
  .d2h-diff-tbody { border: none !important; }
  .d2h-file-side-diff { background: var(--bg) !important; overflow-x: auto !important; container-type: inline-size !important; }
  .d2h-code-wrapper { background: transparent !important; }
  .d2h-code-linenumber, .d2h-code-side-linenumber { display: table-cell !important; background: var(--bg2) !important; border: none !important; box-shadow: 1px 0 0 0 var(--border) !important; color: var(--text-dim) !important; cursor: pointer !important; position: sticky !important; left: 0; z-index: 2; }
  .d2h-code-linenumber { display: flex !important; white-space: nowrap !important; align-items: center !important; position: relative !important; vertical-align: top !important; padding: 2px 0 !important; }
  .d2h-code-linenumber > .line-num1, .d2h-code-linenumber > .line-num2 { min-width: 2em; text-align: right; padding: 0 2px; }
  .d2h-code-linenumber::after, .d2h-code-side-linenumber::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: inherit; z-index: -1; }
  .d2h-code-linenumber:hover, .d2h-code-side-linenumber:hover { background: var(--accent) !important; color: #fff !important; }
  .d2h-code-side-line, .d2h-code-line { background: var(--bg) !important; color: var(--text) !important; padding: 0 0.5em !important; width: auto !important; overflow: hidden !important; }
  .d2h-ins .d2h-code-side-line, .d2h-ins .d2h-code-line { background: var(--add) !important; }
  .d2h-del .d2h-code-side-line, .d2h-del .d2h-code-line { background: var(--del) !important; }
  .d2h-ins .d2h-code-side-line ins, .d2h-ins .d2h-code-line ins { background: var(--add-word) !important; text-decoration: none !important; }
  .d2h-del .d2h-code-side-line del, .d2h-del .d2h-code-line del { background: var(--del-word) !important; text-decoration: none !important; }
  .d2h-ins { background: var(--add) !important; border: none !important; outline: none !important; }
  .d2h-del { background: var(--del) !important; border: none !important; outline: none !important; }
  /* Make hljs backgrounds transparent so diff ins/del colors show through */
  .d2h-code-line .hljs, .d2h-code-side-line .hljs { background: transparent !important; }
  .d2h-ins .hljs, .d2h-del .hljs { background: transparent !important; }
  .d2h-code-side-emptyplaceholder, .d2h-emptyplaceholder { background: var(--bg3) !important; border-color: var(--border) !important; }
  .d2h-code-side-linenumber:empty, .d2h-code-linenumber:empty { background: var(--bg3) !important; box-shadow: none !important; display: table-cell !important; }
  .d2h-ins .d2h-code-linenumber, .d2h-ins .d2h-code-side-linenumber { background: var(--add-line) !important; box-shadow: 1px 0 0 0 var(--border) !important; }
  .d2h-del .d2h-code-linenumber, .d2h-del .d2h-code-side-linenumber { background: var(--del-line) !important; box-shadow: 1px 0 0 0 var(--border) !important; }
  .d2h-info { background: var(--bg3) !important; color: var(--text-dim) !important; border-color: var(--border) !important; padding-top: 4px !important; padding-bottom: 4px !important; }
  .d2h-info .d2h-code-side-line, .d2h-info .d2h-code-line { background: var(--bg3) !important; width: auto !important; padding: 0 0.5em !important; position: sticky !important; left: 0 !important; }
  .d2h-info .d2h-code-linenumber, .d2h-info .d2h-code-side-linenumber { background: var(--bg3) !important; padding: 4px 6px !important; }
  td.d2h-code-linenumber.d2h-info { display: table-cell !important; }
  .d2h-tag { background: var(--bg3) !important; color: var(--text-dim) !important; border-radius: var(--radius) !important; padding: 1px 6px !important; margin-left: 8px !important; font-size: 0.625rem !important; }

  /* Per-file word wrap (toggled via checkbox in file header) */
  /* Use table-layout: fixed so columns don't auto-grow to longest line */
  .d2h-file-wrapper.revue-wrap .d2h-diff-table {
    table-layout: fixed !important;
    width: 100% !important;
    min-width: 0 !important;
  }
  /* Constrain line-number columns; let content take the rest */
  .d2h-file-wrapper.revue-wrap td.d2h-code-side-linenumber,
  .d2h-file-wrapper.revue-wrap td.d2h-code-linenumber {
    width: 3.5em !important;
  }
  /* Use flexbox on the line container so the prefix sits beside a flex-grow
     content span that wraps within the remaining width. We must NOT use
     pre-wrap on the outer container because diff2html's HTML has literal
     newlines/indentation between child <span>s — pre-wrap there would render
     them as visible empty lines and inflate row heights. */
  .d2h-file-wrapper.revue-wrap .d2h-code-side-line,
  .d2h-file-wrapper.revue-wrap td.d2h-code-line {
    display: flex !important;
    align-items: flex-start !important;
    overflow: hidden !important;
    width: auto !important;
    white-space: normal !important;
    padding: 2px 0.5em !important;
    line-height: 1.4 !important;
  }
  .d2h-file-wrapper.revue-wrap .d2h-code-line-prefix {
    flex: 0 0 auto !important;
  }
  .d2h-file-wrapper.revue-wrap .d2h-code-line-ctn {
    flex: 1 1 0 !important;
    min-width: 0 !important;
    white-space: pre-wrap !important;
    word-break: break-word !important;
    overflow-wrap: anywhere !important;
  }
  /* Linenumber cells need matching vertical padding so they align with
     synced row heights (they don't use flex, so add it here). */
  .d2h-file-wrapper.revue-wrap td.d2h-code-side-linenumber,
  .d2h-file-wrapper.revue-wrap td.d2h-code-linenumber {
    padding: 2px 0 !important;
    vertical-align: top !important;
  }
  /* Hide horizontal scrollbars when wrapping */
  .d2h-file-wrapper.revue-wrap .d2h-file-side-diff,
  .d2h-file-wrapper.revue-wrap .d2h-files-diff > .d2h-file-side-diff,
  .d2h-file-wrapper.revue-wrap .d2h-code-wrapper { overflow-x: hidden !important; }

  .revue-wrap-toggle {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: auto; font-size: 0.6875rem; color: var(--text-dim);
    cursor: pointer; user-select: none; padding: 0 4px;
  }
  .revue-wrap-toggle input { margin: 0; cursor: pointer; }
  /* Diff2html's built-in `<label class="d2h-file-collapse"><input>Viewed</label>`
     ships in every header but starts hidden by default in the CDN bundle. We
     show it everywhere -- our own change-listener wired in JS handles the
     collapse + persistence (see wireViewedCheckbox()). */
  .d2h-file-collapse {
    display: inline-flex !important; align-items: center; gap: 4px;
    margin-left: auto; font-size: 0.6875rem; color: var(--text-dim) !important;
    cursor: pointer; user-select: none; padding: 0 4px;
    border: none !important; background: none !important;
  }
  .d2h-file-collapse + .revue-wrap-toggle { margin-left: 0; }
  .d2h-file-collapse-input { margin: 0; cursor: pointer; }
  /* When a wrapper is marked viewed, hide its body and dim the header. The
     wrap toggle is also hidden to avoid presenting an action that has no
     visible effect while collapsed. */
  .d2h-file-wrapper.revue-viewed .d2h-file-diff,
  .d2h-file-wrapper.revue-viewed .d2h-files-diff { display: none !important; }
  .d2h-file-wrapper.revue-viewed .d2h-file-header { opacity: 0.55; }
  .d2h-file-wrapper.revue-viewed .revue-wrap-toggle { visibility: hidden; }
  .d2h-file-header { display: flex !important; align-items: center !important; }

  /* Expand context button on hunk headers */
  .revue-expand-btn { background: none; border: none; color: inherit; cursor: pointer; font-size: 0.75rem; padding: 0; line-height: 1; }

  /* Comment threads injected into diff */
  .revue-comment-row { background: var(--comment-bg) !important; border-left: 3px solid var(--comment-border); }
  .revue-spacer-row { background: var(--bg3) !important; border-left: none !important; }
  .revue-comment-row td { padding: 0 !important; width: 0; min-width: 0; overflow: visible; }
  .revue-comment-thread, .revue-comment-input-wrap {
    box-sizing: border-box;
    position: sticky;
    left: 4px;
    margin: 4px 0;
    width: calc(100cqw - 12px);
  }
  .revue-comment-thread {
    padding: 8px 12px;
    font-family: var(--font);
    font-size: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .revue-comment-item {
    background: var(--comment-bg);
    color: var(--comment-text);
    border: 1px solid var(--comment-border);
    border-radius: var(--radius);
    padding: 6px 10px;
    position: relative;
  }
  .revue-comment-body { line-height: 1.5; }
  .revue-comment-author { font-size: 0.625rem; font-weight: 600; color: var(--text-dim); margin-bottom: 2px; }
  .revue-comment-meta { font-size: 0.625rem; color: var(--text-dim); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .revue-comment-meta button {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.625rem;
    padding: 0;
    text-decoration: underline;
  }
  .revue-comment-meta button:hover { color: var(--text); }
  .revue-comment-item.resolved { opacity: 0.45; }
  .revue-replies { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .revue-reply { background: var(--bg3); border-radius: var(--radius); padding: 4px 8px; font-size: 0.6875rem; }
  .revue-reply-input, .revue-comment-edit { margin-top: 4px; }
  .revue-reply-input textarea, .revue-comment-edit textarea { width: 100%; background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 6px; font-family: var(--font); font-size: 0.6875rem; resize: vertical; min-height: 40px; }
  .revue-reply-input textarea:focus, .revue-comment-edit textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  /* Comment input box */
  .revue-comment-input-wrap {
    background: var(--bg2);
    border: 1px solid var(--comment-border);
    border-radius: var(--radius);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .revue-comment-input-wrap textarea {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 8px;
    font-family: var(--font);
    font-size: 0.75rem;
    resize: vertical;
    min-height: 60px;
    width: 100%;
  }
  .revue-comment-input-wrap textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .revue-comment-btn-row { display: flex; gap: 6px; justify-content: flex-end; }
  .revue-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 4px 12px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .revue-btn:hover { background: var(--accent2); }
  .revue-btn.secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .revue-btn.secondary:hover { background: var(--border); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  #loading { padding: 20px; color: var(--text-dim); text-align: center; }
  .show-resolved-wrap { padding: 6px 10px; display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-dim); flex-shrink: 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .show-resolved-wrap input { cursor: pointer; }
  .delete-resolved-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.6875rem; text-decoration: underline; padding: 0; margin-left: auto; }
  .delete-resolved-btn:hover { color: var(--del-text, #f47174); }
  .other-branches-count { margin-left: auto; font-size: 0.6875rem; color: var(--text-dim); font-style: italic; }
  .revue-branch-badge { display: inline-block; padding: 1px 7px; margin-left: 6px; font-size: 0.6875rem; font-weight: 500; color: var(--accent); background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; vertical-align: baseline; }
  .orphaned-file-item { border-top: 1px solid var(--border); margin-top: 4px; font-style: italic; }
  .orphaned-wrapper { border: 1px solid var(--border); border-radius: var(--radius); margin-top: 8px; }

  /* Agent panel — "these comments are ready to address" hand-off to Copilot */
  /* Sticky so the Send button stays reachable under a long file tree. */
  #agent-panel { position: sticky; bottom: 0; z-index: 6; margin-top: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; border-top: 1px solid var(--border); background: var(--bg2); }
  #agent-status { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-dim); }
  #agent-status .agent-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  #agent-status.attached .agent-dot { background: var(--ok); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 25%, transparent); }
  #agent-status.working .agent-dot { background: var(--accent); animation: agent-pulse 1.2s ease-in-out infinite; }
  @keyframes agent-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  #agent-note { width: 100%; box-sizing: border-box; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 6px; font-family: inherit; font-size: 0.75rem; }
  #agent-send { width: 100%; padding: 6px 10px; }
  #agent-send:disabled { opacity: 0.5; cursor: default; }
  #agent-cancel { width: 100%; padding: 6px 10px; }
  #agent-hint { font-size: 0.6875rem; color: var(--text-dim); font-style: italic; }
  .agent-link {
    background: none; border: none; padding: 0; cursor: pointer;
    color: var(--text-dim); font-family: inherit; font-size: 0.6875rem;
    text-decoration: underline; text-align: left;
  }
  .agent-link:hover { color: var(--accent); }
  .agent-link:disabled { opacity: 0.5; cursor: default; text-decoration: none; }
  .orphaned-comments-list { padding: 8px 0; }
  .orphaned-file-group { margin-bottom: 8px; }
  .orphaned-file-header { font-family: var(--mono); font-size: 0.75rem; color: var(--accent); padding: 4px 12px; font-weight: 600; }

  /* Commit-message wrappers are real diff2html-rendered .d2h-file-wrapper
     entries whose path starts with the commit sentinel. We just need to (a)
     suppress noise that doesn't make sense for a message (the `+` line prefix,
     the +N/-0 stats badge, the new-file tag, the hunk @@ info row), (b)
     dress up the header with the commit metadata, and (c) bold the subject
     line so it reads as a title. Everything else -- comments, viewed, wrap,
     line clicks -- flows through the existing diff pipeline. */
  .revue-commit .d2h-file-stats { display: none !important; }
  .revue-commit .d2h-tag { display: none !important; }
  .revue-commit .d2h-code-line-prefix { display: none !important; }
  /* Commit messages are all additions so the "old line number" half of the
     d2h linenumber cell is always empty. It still claims a 2em column via the
     global min-width rule -- hide it so the actual number sits flush. Then
     override the flex-cell layout (which is meaningful for diff line-pairs in
     inline mode but just leaves a giant empty column for a single-number
     commit cell) back to plain table-cell, and let the visible number own the
     padding so the whole linenumber column is a click target. */
  .revue-commit .d2h-code-linenumber .line-num1 { display: none !important; }
  .revue-commit td.d2h-code-linenumber {
    display: table-cell !important;
    padding: 0 !important;
    min-width: 0 !important;
    width: auto !important;
  }
  .revue-commit .d2h-code-linenumber .line-num2 {
    display: block !important;
    text-align: right !important;
    padding: 2px 6px !important;
    min-width: 2.5em !important;
  }
  /* Hide the synthesised `@@ -0,0 +1,N @@` hunk header -- it adds noise for a
     commit message. The class lives on the <td>, not the <tr>, so target the
     wrapping row (always the first body row in a single-hunk add-only diff). */
  .revue-commit tbody > tr:first-child { display: none !important; }
  /* With the hunk row hidden, the subject is the next row. Bold it so the
     title reads distinctly from the body. */
  .revue-commit tbody > tr:nth-child(2) .d2h-code-line { font-weight: 600; }
  /* Header decoration injected by decorateCommitHeader() */
  .revue-commit .d2h-file-name {
    display: inline-flex !important; align-items: baseline; gap: 8px;
    font-family: var(--mono); font-size: 0.75rem;
    overflow: hidden; flex: 1 1 auto; min-width: 0;
  }
  .revue-commit .revue-commit-icon { font-size: 0.875rem; line-height: 1; }
  .revue-commit .revue-commit-hash { color: var(--accent); font-weight: 600; }
  .revue-commit .revue-commit-subject {
    color: var(--text); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1 1 auto; min-width: 0;
  }
  .revue-commit .revue-commit-meta {
    color: var(--text-dim); font-size: 0.6875rem;
    margin-left: 12px; margin-right: 12px; flex-shrink: 0;
  }
  /* A draft written against a different branch or range */
  .revue-pr-stale {
    display: inline-block; padding: 0 6px; margin-left: 6px; flex-shrink: 0;
    font-size: 0.625rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px;
    color: var(--warning-text); background: var(--warning-bg);
    border: 1px solid var(--warning-border); border-radius: 8px;
  }
  /* "Commits" virtual section in the file tree */
  .commits-tree-header {
    padding: 4px 10px; font-size: 0.6875rem; font-weight: 600;
    color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    margin-top: 4px;
  }
  .commit-tree-item {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 26px;
    font-size: 0.75rem;
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .commit-tree-item:hover { background: var(--bg2); }
  .commit-tree-item.active { background: var(--accent2); }
  .commit-tree-item .commit-tree-hash {
    font-family: var(--mono); color: var(--accent); font-size: 0.6875rem; flex-shrink: 0;
  }
  .commit-tree-item .commit-tree-subject {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text); flex: 1 1 auto; min-width: 0;
  }
  .commit-tree-item .comment-badge { margin-left: auto; }
</style>
</head>
<body>

<div id="topbar">
  <span class="logo-icon">🎭</span><span class="logo">revue</span>
  <div id="repo-wrapper">
    <button id="repo-btn"><span id="repo-current">repo</span> ▾</button>

  </div>
  <div class="topbar-group">

  <div id="settings-wrapper">

    <div id="settings-panel">
      <div class="settings-item">
        <label for="setting-theme">Theme</label>

        <label for="setting-layout">Diff layout</label>

          <option value="side-by-side" selected>Side by side</option>
          <option value="line-by-line">Inline</option>

      <div class="settings-item">
        <input type="checkbox" id="setting-all-branches" />

        <input type="checkbox" id="setting-all-commits" />

</div>

<script>
const API = '';
let state = {
  base: '',
  head: 'HEAD',
  repos: [],              // repos this instance is serving (for the selector)
  repo: '',               // active repo path; threaded into repo-scoped API calls + the URL hash
  files: [],
  comments: [],
  currentFile: null,
  showResolved: true,
  ignoreWhitespace: false,
  diffLayout: 'side-by-side',
  fileContext: {},  // file -> context line count (default 5)
  currentBranch: null,    // git branch we're checked out on (null = detached HEAD)
  showAllBranches: false, // when true, show comments from all branches
  showAllCommits: false,  // when true, show comments anchored to commits outside the viewed range
  rangeCommits: new Set(),// full shas of the commits in the diff currently on screen
  windowSize: 10,         // max files mounted at once (0 = render all)
  windowStart: 0,         // index into state.files for first rendered file
  collapsedFolders: new Set(),
  agent: { attached: false, waiters: 0, pending: 0, active: null, last: null },
  commentsDirty: false,   // live comment refresh deferred while an edit/reply box is open
  rewritePending: false,  // a pinned commit has left the branch; retry following it each tick
  filesDirty: false,      // ditto for a file refetch (a round rewrote the PR draft)
  version: null,          // version of the server this page is talking to
  restarting: false,      // a restart is in flight; the page reloads when it lands
};

// ── Utilities ──────────────────────────────────────────────────────────────

function savePref(key, val) { document.cookie = `revue_${key}=${encodeURIComponent(val)};path=/;max-age=31536000`; }
function loadPref(key, fallback) {
  const m = document.cookie.match(new RegExp(`revue_${key}=([^;]+)`));
  return m ? decodeURIComponent(m[1]) : fallback;
}

// ── URL hash state ─────────────────────────────────────────────────────────
//
// The location.hash carries the *per-review* context (which refs we're
// comparing, which commit range is selected, which file the user was last on)
// so a refresh restores exactly that, browser back/forward steps through
// review contexts, and copy-pasting the URL is a deeplink. Personal display
// preferences (theme, layout, ignoreWhitespace, viewedFiles, etc.) stay in
// cookies -- a deeplink shouldn't impose the sender's preferences on the
// recipient.
//
// Format: #base=<branch>&head=<branch>&range=<start..end>&file=<encoded-path>
//
// `base` and `head` are the *branch context* (what the topbar selectors show),
// never the resolved diff endpoints. When `range` is also set, it overrides
// the branch context to scope the diff to one commit or a commit range; the
// resolved state.base / state.head are then derived from `range`, so the
// branch context stays intact for "clear range" / back-navigation. Range is
// stored as `older..newer` so derivation is deterministic without depending
// on state.commits being loaded.

let _applyingHash = false;

function parseHashState() {
  const raw = location.hash.startsWith('#') ? location.hash.slice(1) : location.hash;
  if (!raw) return {};
  const out = {};
  for (const part of raw.split('&')) {
    if (!part) continue;
    const eq = part.indexOf('=');
    if (eq < 0) continue;
    const k = decodeURIComponent(part.slice(0, eq));
    const v = decodeURIComponent(part.slice(eq + 1));
    out[k] = v;
  }
  return out;
}

function buildHashFromState() {
  const parts = [];
  // Only carry repo in the hash when the instance serves more than one, so
  // single-repo deeplinks stay clean and back-compatible.
  if (state.repo && state.repos.length > 1) parts.push(`repo=${encodeURIComponent(state.repo)}`);
  if (state.logBase) parts.push(`base=${encodeURIComponent(state.logBase)}`);
  parts.push(`head=${encodeURIComponent(state.logHead || 'HEAD')}`);
  if (state.rangeStart) {
    // For single-commit or working-tree selections, no end exists.
    if (!state.rangeEnd || state.rangeEnd === state.rangeStart || state.rangeStart === '~working~') {
      parts.push(`range=${encodeURIComponent(state.rangeStart)}`);
    } else {
      // Both ends set: reorder to `older..newer` using state.commits so
      // restoration can derive base/head without needing the commit list
      // (commits are loaded on demand when the picker is opened).
      const commits = state.commits || [];
      const si = commits.findIndex(c => c.hash === state.rangeStart);
      const ei = commits.findIndex(c => c.hash === state.rangeEnd);
      // commits are newest-first, so higher index = older.
      let older = state.rangeStart, newer = state.rangeEnd;
      if (si >= 0 && ei >= 0 && si < ei) {
        older = state.rangeEnd; newer = state.rangeStart;
      }
      parts.push(`range=${encodeURIComponent(`${older}..${newer}`)}`);
    }
  }
  if (state.currentFile) parts.push(`file=${encodeURIComponent(state.currentFile)}`);
  return parts.length ? '#' + parts.join('&') : '';
}

// `mode` is 'push' for big context switches (base/head/range) that deserve
// a back-button entry, or 'replace' for incidental updates (currentFile,
// scroll position) that would otherwise spam history.
function writeHashFromState(mode) {
  if (_applyingHash) return;
  const newHash = buildHashFromState();
  const current = location.hash || '';
  if (newHash === current) return;
  const url = location.pathname + location.search + (newHash || '#');
  if (mode === 'push') history.pushState(null, '', url);
  else history.replaceState(null, '', url);
}

// Apply a parsed hash object to state. Always re-derives state.base /
// state.head from logBase / logHead + range so navigating BACK from a
// range-overridden view restores the underlying branch diff. Returns true
// if anything review-relevant changed so callers know to re-fetch.
function applyHashToState(parsed) {
  const before = {
    base: state.base, head: state.head,
    start: state.rangeStart, end: state.rangeEnd,
    logBase: state.logBase, logHead: state.logHead,
  };

  if (parsed.base) state.logBase = parsed.base;
  state.logHead = parsed.head || 'HEAD';

  const range = parsed.range || '';
  const [rs, re] = range ? range.split('..') : [null, null];
  state.rangeStart = rs || null;
  state.rangeEnd = re || null;

  if (!state.rangeStart) {
    state.base = state.logBase;
    state.head = state.logHead;
  } else if (state.rangeStart === '~working~') {
    state.base = 'HEAD'; state.head = 'HEAD';
  } else if (!state.rangeEnd) {
    state.base = state.rangeStart + '^';
    state.head = state.rangeStart;
  } else {
    state.base = state.rangeStart + '^';
    state.head = state.rangeEnd === '~working~' ? 'HEAD' : state.rangeEnd;
  }

  state.currentFile = parsed.file || null;

  return state.base !== before.base
      || state.head !== before.head
      || state.rangeStart !== before.start
      || state.rangeEnd !== before.end;
}

// Restore saved preferences
state.ignoreWhitespace = loadPref('ignoreWhitespace', 'false') === 'true';
state.diffLayout = loadPref('diffLayout', 'side-by-side');
state.showResolved = loadPref('showResolved', 'true') === 'true';
state.showCommitMessages = loadPref('showCommitMessages', 'true') === 'true';
state.showPrMessage = loadPref('showPrMessage', 'true') === 'true';
state.theme = loadPref('theme', 'auto');
state.showAllBranches = loadPref('showAllBranches', 'false') === 'true';
state.showAllCommits = loadPref('showAllCommits', 'false') === 'true';
state.wrappedFiles = new Set(loadPref('wrappedFiles', '').split('\n').filter(Boolean));
state.viewedFiles = new Set(loadPref('viewedFiles', '').split('\n').filter(Boolean));
const _ws = parseInt(loadPref('windowSize', '10'), 10);
state.windowSize = Number.isFinite(_ws) && _ws >= 0 ? _ws : 10;
function saveWrappedFiles() { savePref('wrappedFiles', [...state.wrappedFiles].join('\n')); }
function saveViewedFiles() { savePref('viewedFiles', [...state.viewedFiles].join('\n')); }

function applyTheme(theme) {
  const resolved = theme === 'auto'
    ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : theme;
  document.documentElement.setAttribute('data-theme', resolved);
  // Swap highlight.js stylesheet
  const hlLink = document.querySelector('link[href*="highlight.js"]');
  if (hlLink) {
    const style = resolved === 'light' ? 'github' : 'github-dark';
    hlLink.href = `https://cdn.jsdelivr.net/npm/highlight.js@11/styles/${style}.min.css`;
  }
}
applyTheme(state.theme);
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if (state.theme === 'auto') applyTheme('auto');
});

// Repo-scoped API paths carry the active repo so one instance can serve several
// repos at once. Global endpoints (config / ping / repos) are left untouched.
function withRepo(path) {
  if (!state.repo || !path.startsWith('/api/')) return path;
  if (/^\/api\/(config|ping|repos)(?:[/?]|$)/.test(path)) return path;
  const sep = path.includes('?') ? '&' : '?';
  return `${path}${sep}repo=${encodeURIComponent(state.repo)}`;
}

async function api(path) {
  const r = await fetch(API + withRepo(path));
  if (!r.ok) throw new Error(`API error ${r.status}: ${await r.text()}`);
  return r.json();
}

async function apiPost(path, body) {
  const r = await fetch(API + withRepo(path), {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`API error ${r.status}: ${await r.text()}`);
  const text = await r.text();
  return text ? JSON.parse(text) : null;
}

async function apiDelete(path) {
  const r = await fetch(API + withRepo(path), { method: 'DELETE' });
  if (!r.ok) throw new Error(`API error ${r.status}: ${await r.text()}`);
}

async function reloadComments() {
  state.comments = await api('/api/comments');
  if (window.resetCommentsBaseline) window.resetCommentsBaseline();
  updateOtherBranchesUI();
  updateOtherCommitsUI();
  renderAgentPanel();
}

// ── Live comments ──────────────────────────────────────────────────────────
//
// Comment activity (a reply from Copilot, a comment left in another tab) lands
// in the diff on its own rather than behind a "click to reload" banner. The one
// thing that must not be interrupted is typing: renderAllDiffs() re-hydrates an
// open *new comment* box but not an open edit / reply box, so a refresh that
// arrives while one of those is on screen is deferred until it closes.

function commentEditorOpen() {
  return !!document.querySelector('.revue-comment-edit, .revue-reply-input');
}

async function applyLiveComments() {
  if (commentEditorOpen()) { state.commentsDirty = true; return; }
  state.commentsDirty = false;
  updateOtherBranchesUI();
  updateOtherCommitsUI();
  renderFileList();
  await renderAllDiffs();
  // Badge counts come from the injectable-id set that renderAllDiffs computes,
  // so the list needs a second pass to catch up with comments that just arrived.
  renderFileList();
}

// A finished round rewrites the PR draft as well as the comments, so the file
// list has to be refetched -- but that re-renders the diff, which would discard
// an open edit/reply box. Defer it the same way comment refreshes are deferred.
async function applyLiveFiles() {
  if (commentEditorOpen()) { state.filesDirty = true; return; }
  state.filesDirty = false;
  await loadFiles();
}

// A history rewrite (rebase, amend, squash) leaves the view pinned to shas that
// no longer exist. The commits themselves survive in the object database, so the
// stale view keeps rendering convincingly -- it just quietly stops being the
// branch. Follow the rewrite instead: re-point a selected range at wherever its
// commits ended up.
//
// Returns 'pending' when a pin has left the branch but nothing yet says where it
// went. A rewrite and the remap that describes it are two separate steps, so a
// poll landing between them must not conclude the commit is gone -- the pin is
// kept and the next tick retries. The user's selection is never discarded on our
// own initiative: a stale pin is recoverable, a cleared one isn't.
async function followHistoryRewrite() {
  if (!state.rangeStart) return 'none';
  const pins = [state.rangeStart, state.rangeEnd].filter(s => s && s !== '~working~');
  if (!pins.length) return 'none';

  // Only a pin that has actually left the branch needs following. Ordinary work
  // (a new commit on top) also changes the commit set, and re-pointing then
  // would move the user off the commit they deliberately selected.
  let live;
  try {
    live = await api(`/api/log?base=${encodeURIComponent(state.logBase)}&head=${encodeURIComponent(state.logHead)}`);
  } catch { return 'pending'; }
  // /api/log abbreviates its hashes, so compare by prefix rather than equality.
  const onBranch = sha => (live || []).some(c => sha.startsWith(c.hash) || c.hash.startsWith(sha));
  if (pins.every(onBranch)) return 'none';

  async function moved(sha) {
    if (onBranch(sha)) return sha;
    try {
      const r = await api(`/api/commit-remap?sha=${encodeURIComponent(sha)}`);
      return r && r.sha ? r.sha : null;
    } catch { return null; }
  }

  // A single-commit selection has no end, which is not the same as an end that
  // couldn't be resolved.
  const resolvable = s => !s || s === '~working~' ? s : moved(s);
  const start = await resolvable(state.rangeStart);
  const end = await resolvable(state.rangeEnd);
  if (!start || (state.rangeEnd && !end)) return 'pending';

  state.rangeStart = start;
  state.rangeEnd = end;
  applyHashToState({ ...parseHashState(), range: buildRangeParam() });
  writeHashFromState('replace');
  return 'followed';
}

// The `range` hash parameter for the current selection, in the same
// `older..newer` form parseHashState expects.
function buildRangeParam() {
  if (!state.rangeStart) return '';
  if (!state.rangeEnd || state.rangeEnd === state.rangeStart) return state.rangeStart;
  return `${state.rangeStart}..${state.rangeEnd}`;
}

// Called when an edit / reply box closes, to land anything that arrived meanwhile.
function flushLiveComments() {
  if (state.filesDirty) { applyLiveFiles(); return; }
  if (state.commentsDirty) applyLiveComments();
}

// Comment is visible (branch-wise) when:
//   - the user opted to show all branches
//   - we don't know the current branch (detached HEAD)
//   - the comment has no branch (legacy / created in detached HEAD state)
//   - the comment's branch matches the current branch
function branchVisible(c) {
  if (state.showAllBranches) return true;
  if (!state.currentBranch) return true;
  if (!c.branch) return true;
  return c.branch === state.currentBranch;
}

// Recorded on comments written against work that isn't in any commit yet.
const WORKING_TREE_COMMIT = 'working';

// Comment belongs to the range currently on screen when:
//   - it has no commit (legacy, or git couldn't resolve one)
//   - it's on the PR description, which describes the branch rather than a commit
//   - it was written against uncommitted work and the view still includes the working tree
//   - the commit it's anchored to is one of the commits on screen
function commitInView(c) {
  if (!c.commit) return true;
  if (isPrFile(c.file)) return true;
  if (c.commit === WORKING_TREE_COMMIT) return state.head === 'HEAD';
  return state.rangeCommits.has(c.commit);
}

function commitVisible(c) { return state.showAllCommits || commitInView(c); }

// The two review-context filters. Everything that lists comments goes through
// this so the file-tree badges, the diff, the orphaned section and the agent
// hand-off can't disagree about what the user is looking at.
function commentVisible(c) { return branchVisible(c) && commitVisible(c); }

// Show a count + the toggle row whenever there are comments hidden by the branch filter.
function updateOtherBranchesUI() {
  const wrap = document.getElementById('other-branches-wrap');
  const countEl = document.getElementById('other-branches-count');
  if (!wrap || !countEl) return;
  const cb = document.getElementById('show-all-branches');
  if (cb) cb.checked = state.showAllBranches;
  if (!state.currentBranch) { wrap.style.display = 'none'; return; }
  const otherCount = state.comments.filter(c => c.branch && c.branch !== state.currentBranch).length;
  if (otherCount === 0 && !state.showAllBranches) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  countEl.textContent = otherCount > 0 ? `${otherCount} on other branches` : '';
}

// Same idea for the commit filter: comments anchored to a commit outside the
// range on screen are hidden, so say how many and offer the way back.
function updateOtherCommitsUI() {
  const wrap = document.getElementById('other-commits-wrap');
  const countEl = document.getElementById('other-commits-count');
  if (!wrap || !countEl) return;
  const cb = document.getElementById('show-all-commits');
  if (cb) cb.checked = state.showAllCommits;
  const otherCount = state.comments.filter(c => branchVisible(c) && !commitInView(c)).length;
  if (otherCount === 0 && !state.showAllCommits) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  countEl.textContent = otherCount > 0 ? `${otherCount} on other commits` : '';
}

// ── Agent hand-off ─────────────────────────────────────────────────────────
//
// "These comments are ready to address": the browser queues a request that the
// Copilot session which launched revue claims via a long-poll on
// /api/agent/wait. That session may not exist (revue started by hand) or may be
// busy, so the panel always reports what it knows: attached / working / done.

// The comments a Send would cover: unresolved and visible under the branch filter.
function agentCandidateComments() {
  return state.comments.filter(c => !c.resolved).filter(commentVisible);
}

function renderAgentPanel() {
  const statusEl = document.getElementById('agent-status');
  const textEl = document.getElementById('agent-status-text');
  const sendBtn = document.getElementById('agent-send');
  const cancelBtn = document.getElementById('agent-cancel');
  const hintEl = document.getElementById('agent-hint');
  const noteEl = document.getElementById('agent-note');
  if (!statusEl || !sendBtn) return;

  const a = state.agent || {};
  const count = agentCandidateComments().length;
  const inFlight = a.active || (a.pending > 0);
  const redraft = document.getElementById('agent-redraft');
  if (redraft) {
    redraft.disabled = !!inFlight || !a.attached;
    redraft.title = a.attached ? '' : 'Needs an attached Copilot session';
  }

  statusEl.classList.toggle('attached', !!a.attached && !a.active);
  statusEl.classList.toggle('working', !!a.active);

  sendBtn.style.display = inFlight ? 'none' : '';
  cancelBtn.style.display = inFlight ? '' : 'none';
  noteEl.disabled = !!inFlight;

  if (a.active) {
    textEl.textContent = 'Copilot is working…';
    hintEl.textContent = a.active.kind === 'pr-draft'
      ? 'Drafting the PR description…'
      : (a.active.note ? `Note: ${a.active.note}` : `${a.active.commentIds.length} comment${a.active.commentIds.length === 1 ? '' : 's'} sent`);
    return;
  }
  if (a.pending > 0) {
    textEl.textContent = 'Queued for Copilot';
    hintEl.textContent = a.attached ? 'Picking it up…' : 'Waiting for a Copilot session to attach.';
    return;
  }

  textEl.textContent = a.attached ? 'Copilot attached' : 'No Copilot session attached';
  sendBtn.disabled = count === 0;
  sendBtn.textContent = count === 0
    ? '🤖 No comments to send'
    : `🤖 Send ${count} comment${count === 1 ? '' : 's'} to Copilot`;

  if (a.last && a.last.completed) {
    hintEl.textContent = a.last.summary
      ? `✓ ${a.last.summary}`
      : '✓ Copilot finished the last round.';
  } else if (!a.attached) {
    hintEl.textContent = 'Requests queue until a Copilot session attaches.';
  } else {
    hintEl.textContent = '';
  }
}

async function refreshAgentStatus() {
  try {
    const status = await api('/api/agent/status');
    const wasWorking = !!(state.agent && state.agent.active);
    state.agent = status;
    // A finished round means new replies and a fresh PR draft are already on
    // disk; pull them in now rather than waiting for the next comment poll tick.
    if (wasWorking && !status.active) {
      await reloadCommentsLive();
      await applyLiveFiles();
    }
    renderAgentPanel();
    maybeAutoDraftPr();
  } catch { /* best-effort */ }
}

async function reloadCommentsLive() {
  try {
    state.comments = await api('/api/comments');
    if (window.resetCommentsBaseline) window.resetCommentsBaseline();
    await applyLiveComments();
  } catch { /* best-effort */ }
}

async function sendToAgent() {
  const sendBtn = document.getElementById('agent-send');
  const noteEl = document.getElementById('agent-note');
  const ids = agentCandidateComments().map(c => c.id);
  if (!ids.length) return;
  sendBtn.disabled = true;
  try {
    const request = await apiPost('/api/agent/requests', { note: noteEl.value.trim(), commentIds: ids });
    noteEl.value = '';
    state.agent = { ...state.agent, pending: (state.agent.pending || 0) + 1, queued: request, last: null };
    renderAgentPanel();
    // The waiter claims it within milliseconds; check back rather than waiting 5s.
    setTimeout(refreshAgentStatus, 400);
    return request;
  } catch (e) {
    document.getElementById('agent-hint').textContent = `Failed to send: ${e.message}`;
    sendBtn.disabled = false;
  }
}

// Asks the attached session for a fresh PR description. Same queue and wake-up
// as a comment round -- only the kind differs.
async function requestPrDraft(note) {
  try {
    const request = await apiPost(
      `/api/agent/requests?base=${encodeURIComponent(state.base)}&head=${encodeURIComponent(state.head)}`,
      { kind: 'pr-draft', note: note || '', commentIds: [] });
    state.agent = { ...state.agent, pending: (state.agent.pending || 0) + 1, queued: request, last: null };
    renderAgentPanel();
    setTimeout(refreshAgentStatus, 400);
    return request;
  } catch (e) {
    document.getElementById('agent-hint').textContent = `Failed to request a draft: ${e.message}`;
    return null;
  }
}

// The PR description should already be there when the user arrives, so ask for
// one as soon as a session is attached. Keyed by review context so it fires once
// per base/head/repo rather than on every poll tick.
let _autoDraftedFor = null;
async function maybeAutoDraftPr() {
  if (!state.agent || !state.agent.attached) return;
  if (state.agent.active || state.agent.pending) return;
  const key = `${state.repo}|${state.base}|${state.head}`;
  if (_autoDraftedFor === key) return;
  // Claim the key before the first await: two overlapping status refreshes
  // would otherwise both get past the check and queue a round each.
  _autoDraftedFor = key;
  // Only when there's nothing to show; an existing draft is refreshed by rounds.
  if (state.files.some(f => isPrFile(f.file))) return;
  try {
    const existing = await api(`/api/pr?base=${encodeURIComponent(state.base)}&head=${encodeURIComponent(state.head)}`);
    if (existing && existing.draft) return;
  } catch {
    _autoDraftedFor = null; // couldn't tell; let a later tick retry
    return;
  }
  await requestPrDraft('Initial draft: no comments yet.');
}

async function cancelAgentRequest() {
  const a = state.agent || {};
  const id = (a.active && a.active.id) || (a.queued && a.queued.id);
  if (!id) { await refreshAgentStatus(); return; }
  try { await apiDelete(`/api/agent/requests/${id}`); }
  catch { /* fall through to a status refresh */ }
  await refreshAgentStatus();
}

// ── Update banner & restart ────────────────────────────────────────────────
//
// A newer revue can be installed while this one runs. `updateReady` means it's
// on this machine and can be switched to right here (downloading it first when
// the plugin pins a version whose binary hasn't landed yet); `latestVersion`
// only means GitHub has something newer, which still needs a plugin update.
// Switching always waits for a click -- pulling the server out from under a
// review in progress is worse than running a version behind.

let _updateDismissed = false;

function renderUpdateBanner(info) {
  const banner = document.getElementById('update-banner');
  const msg = document.getElementById('update-msg');
  const btn = document.getElementById('update-restart-btn');
  if (!banner || _updateDismissed || state.restarting) return;

  const ready = info && info.updateReady;
  if (ready) {
    msg.innerHTML = `revue <b>${ready.version}</b> is installed (running ${info.version}).`;
    btn.textContent = ready.needsDownload ? 'Download & restart' : 'Restart now';
    btn.disabled = false;
    btn.style.display = '';
    banner.classList.add('active');
  } else if (info && info.latestVersion && info.updateCommand) {
    msg.innerHTML = `revue <b>${info.latestVersion}</b> is available (running ${info.version}). Run <code>${info.updateCommand}</code>.`;
    btn.style.display = 'none';
    banner.classList.add('active');
  } else {
    banner.classList.remove('active');
  }
}

async function requestRestart() {
  const msg = document.getElementById('update-msg');
  const btn = document.getElementById('update-restart-btn');
  const downloading = btn.textContent.startsWith('Download');
  btn.disabled = true;
  msg.textContent = downloading ? 'Downloading…' : 'Restarting…';
  try {
    const r = await fetch(API + '/api/restart', { method: 'POST' });
    if (!r.ok) {
      let detail = await r.text();
      try { detail = JSON.parse(detail).detail || detail; } catch { /* not problem+json */ }
      throw new Error(detail);
    }
    const body = await r.json();
    watchForRestart(body && body.version);
  } catch (e) {
    msg.textContent = `Restart failed: ${e.message}`;
    btn.disabled = false;
  }
}

// Waits for the replacement to answer on the same port, then reloads so the tab
// picks up the new frontend. Also covers a server restarted by any other means,
// which is why a plain reconnect after downtime counts even when the version is
// unchanged. A null expectedVersion means we only suspect a restart, so a server
// that turns out to be healthy cancels the watch rather than stranding the page.
function watchForRestart(expectedVersion) {
  if (state.restarting) return;
  state.restarting = true;

  const speculative = !expectedVersion;
  const banner = document.getElementById('update-banner');
  const msg = document.getElementById('update-msg');
  document.getElementById('update-restart-btn').style.display = 'none';
  msg.textContent = 'Restarting revue…';
  banner.classList.add('active');

  const started = Date.now();
  let sawDown = false;

  const cancel = () => {
    state.restarting = false;
    banner.classList.remove('active');
  };

  const tick = async () => {
    if (Date.now() - started > 120000) {
      msg.textContent = 'revue did not come back — start it again from your terminal.';
      state.restarting = false;
      return;
    }
    try {
      const r = await fetch(API + '/api/ping', { cache: 'no-store' });
      if (r.ok) {
        const p = await r.json();
        const changed = expectedVersion ? p.version === expectedVersion : p.version !== state.version;
        if (p.app === 'revue' && (changed || sawDown)) { location.reload(); return; }
        if (speculative) { cancel(); return; }
      } else {
        sawDown = true;
      }
    } catch {
      sawDown = true;
    }
    setTimeout(tick, 1000);
  };
  setTimeout(tick, 1000);
}

// ── Stale ref detection ───────────────────────────────────────────────────

async function checkBaseRefStatus() {
  const banner = document.getElementById('stale-banner');
  banner.classList.remove('active');
  try {
    const status = await api(`/api/ref-status?ref=${encodeURIComponent(state.logBase)}`);
    if (!status.tracking || status.behind === 0) return;
    const msg = document.getElementById('stale-msg');
    msg.textContent = `"${state.logBase}" is behind ${status.remote}/${status.branch} — diff may include extra changes`;
    banner.classList.add('active');
    banner.dataset.remote = status.remote;
    banner.dataset.branch = status.branch;
  } catch { /* best-effort, don't block UI */ }
}

document.getElementById('stale-fetch-btn').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  const banner = document.getElementById('stale-banner');
  btn.disabled = true;
  btn.textContent = 'Fetching…';
  try {
    const remote = banner.dataset.remote;
    const branch = banner.dataset.branch;
    await apiPost(`/api/fetch?remote=${encodeURIComponent(remote)}&branch=${encodeURIComponent(branch)}`);
    banner.classList.remove('active');
    loadFiles();
  } catch (err) {
    btn.textContent = 'Fetch failed';
    setTimeout(() => { btn.textContent = 'Fetch'; btn.disabled = false; }, 3000);
  }
});

document.getElementById('stale-dismiss').addEventListener('click', () => {
  document.getElementById('stale-banner').classList.remove('active');
});

// Rebuild the base/head <select> options for the current repo's branches. The
// change listeners live on the elements and persist across repo switches, so
// only the option set is refreshed here.
function populateBranchSelectors(branches) {
  const baseSel = document.getElementById('base-sel');
  const headSel = document.getElementById('head-sel');
  baseSel.innerHTML = '';
  headSel.innerHTML = '';
  const refs = [state.logHead, ...branches];
  refs.forEach(b => {
    baseSel.add(new Option(b, b, false, b === state.logBase));
    headSel.add(new Option(b, b, false, b === state.logHead));
  });
  // ensure the resolved base ref is selectable even if it's not a local branch
  if (!refs.includes(state.logBase)) {
    baseSel.add(new Option(state.logBase, state.logBase, false, true));
  }
  baseSel.value = state.logBase;
  headSel.value = state.logHead;
}

// Renders the topbar repo dropdown: the active repo's name on the button, and a
// switch-on-click row per repo with a × to stop reviewing it (hidden when only
// one repo is registered, since an instance must keep at least one).
function renderRepoSelector() {
  const cur = document.getElementById('repo-current');
  const panel = document.getElementById('repo-panel');
  const active = state.repos.find(r => r.path === state.repo) || state.repos[0];
  cur.textContent = active ? active.name : 'repo';
  cur.title = active ? active.path : '';
  panel.innerHTML = '';
  const multi = state.repos.length > 1;
  state.repos.forEach(r => {
    const row = document.createElement('div');
    row.className = 'repo-row' + (r.path === state.repo ? ' active' : '');

    const name = document.createElement('span');
    name.className = 'repo-name';
    name.textContent = r.name;
    name.title = r.path;
    name.addEventListener('click', () => {
      panel.classList.remove('open');
      if (r.path !== state.repo) selectRepo(r.path);
    });
    row.appendChild(name);

    if (multi) {
      const x = document.createElement('button');
      x.className = 'repo-remove';
      x.textContent = '×';
      x.title = 'Stop reviewing this repo';
      x.addEventListener('click', async (e) => {
        e.stopPropagation();
        try { await apiDelete(`/api/repos?path=${encodeURIComponent(r.path)}`); }
        catch (err) { alert(err.message); return; }
        const data = await api('/api/repos');
        state.repos = data.repos;
        if (r.path === state.repo) {
          await selectRepo(data.primary || (state.repos[0] && state.repos[0].path));
        } else {
          renderRepoSelector();
          writeHashFromState('replace');
        }
      });
      row.appendChild(x);
    }
    panel.appendChild(row);
  });
}

// Switches the active repo: reloads that repo's config, branches, and diff.
// `hash` (optional) restores a review context for the target repo (used by
// back/forward navigation); otherwise the repo's own default base is used.
async function selectRepo(path, hash = null) {
  if (!path || (path === state.repo && !hash)) return;
  state.repo = path;
  state.rangeStart = null;
  state.rangeEnd = null;
  state.commits = null;
  state.currentFile = hash ? (hash.file || null) : null;

  const cfg = await api(`/api/config?repo=${encodeURIComponent(path)}`);
  state.repos = cfg.repos || state.repos;
  state.repo = cfg.repo || path;
  state.currentBranch = cfg.currentBranch || null;
  state.logBase = (hash && hash.base) || cfg.defaultBase;
  state.logHead = (hash && hash.head) || 'HEAD';
  state.base = state.logBase;
  state.head = state.logHead;

  const branches = await api('/api/branches');
  if (hash) applyHashToState(hash);

  populateBranchSelectors(branches);
  renderRepoSelector();
  renderCommitRangeLabel();
  writeHashFromState(hash ? 'replace' : 'push');
  await loadFiles();
  // The agent queue is per-repo, so the panel has to follow the switch.
  state.agent = { attached: false, waiters: 0, pending: 0, active: null, last: null };
  await refreshAgentStatus();
}

// ── Init ───────────────────────────────────────────────────────────────────

async function init() {
  // Resolve the active repo from the hash first (the server falls back to the
  // primary for an unknown/absent repo) so branches + defaults are fetched for
  // the right repo. One instance can serve several repos; state.repo threads
  // through every repo-scoped API call and into the URL hash.
  const initialHash = parseHashState();
  const cfg = await api(`/api/config${initialHash.repo ? '?repo=' + encodeURIComponent(initialHash.repo) : ''}`);
  state.repos = cfg.repos || [];
  state.repo = cfg.repo || (state.repos[0] && state.repos[0].path) || '';
  state.base = cfg.defaultBase;
  state.head = 'HEAD';
  state.logBase = state.base;
  state.logHead = state.head;
  state.currentBranch = cfg.currentBranch || null;
  state.version = cfg.version || null;

  const branches = await api('/api/branches');

  // Hash overrides defaults so a refresh / deeplink restores the exact review
  // context. Done here, before any UI is wired, so the branch selectors below
  // pick up the restored values and loadFiles() runs against them.
  applyHashToState(initialHash);

  if (cfg.version) {
    const hash = cfg.commitHash ? ` (${cfg.commitHash})` : '';
    document.getElementById('version-label').textContent = `v${cfg.version}${hash}`;
  }

  renderUpdateBanner(cfg);
  document.getElementById('update-restart-btn').addEventListener('click', requestRestart);
  document.getElementById('update-dismiss').addEventListener('click', () => {
    _updateDismissed = true;
    document.getElementById('update-banner').classList.remove('active');
  });

  const baseSel = document.getElementById('base-sel');
  const headSel = document.getElementById('head-sel');
  populateBranchSelectors(branches);

  // Repo selector: click a repo to switch, × to stop reviewing it.
  renderRepoSelector();
  const repoBtn = document.getElementById('repo-btn');
  const repoPanel = document.getElementById('repo-panel');
  repoBtn.addEventListener('click', e => { e.stopPropagation(); repoPanel.classList.toggle('open'); });
  document.addEventListener('click', () => repoPanel.classList.remove('open'));
  repoPanel.addEventListener('click', e => e.stopPropagation());

  baseSel.addEventListener('change', () => {
    state.base = baseSel.value; state.logBase = baseSel.value;
    state.rangeStart = null; state.rangeEnd = null;
    state.currentFile = null;
    writeHashFromState('push');
    loadFiles();
  });
  headSel.addEventListener('change', () => {
    state.head = headSel.value; state.logHead = headSel.value;
    state.rangeStart = null; state.rangeEnd = null;
    state.currentFile = null;
    writeHashFromState('push');
    loadFiles();
  });

  // Back/forward navigates between review contexts. Re-apply the hash and, if
  // the review-relevant fields changed (base/head/range), reload; otherwise
  // just scroll to the file the hash points at.
  window.addEventListener('hashchange', () => {
    _applyingHash = true;
    try {
      const parsed = parseHashState();
      // A repo change is a full context switch (different branches/diff/
      // comments), not just a base/head re-derivation, so route it through
      // selectRepo, which restores the review context from the same hash.
      if (parsed.repo && parsed.repo !== state.repo && state.repos.some(r => r.path === parsed.repo)) {
        selectRepo(parsed.repo, parsed);
        return;
      }
      const reviewChanged = applyHashToState(parsed);
      // Keep the branch selectors + range label in sync with the restored
      // state. The selectors show the branch context (logBase / logHead), not
      // the resolved diff endpoints, since the user might be in a range-
      // override where base/head are commit hashes.
      const baseSel = document.getElementById('base-sel');
      const headSel = document.getElementById('head-sel');
      if (baseSel && baseSel.value !== state.logBase) baseSel.value = state.logBase;
      if (headSel && headSel.value !== state.logHead) headSel.value = state.logHead;
      renderCommitRangeLabel();
      if (reviewChanged) {
        loadFiles();
      } else if (state.currentFile) {
        renderFileList();
        jumpToFile(state.currentFile);
      }
    } finally {
      _applyingHash = false;
    }
  });

  document.getElementById('show-resolved').addEventListener('change', e => {
    state.showResolved = e.target.checked;
    savePref('showResolved', state.showResolved);
    renderFileList();
    renderAllDiffs();
  });

  // Branch filter — both the inline filelist toggle and the settings panel toggle stay in sync.
  function applyBranchFilterChange(checked) {
    state.showAllBranches = checked;
    savePref('showAllBranches', state.showAllBranches);
    document.getElementById('show-all-branches').checked = checked;
    document.getElementById('setting-all-branches').checked = checked;
    updateOtherBranchesUI();
    renderFileList();
    renderAllDiffs();
    renderAgentPanel();
  }
  document.getElementById('show-all-branches').addEventListener('change', e => applyBranchFilterChange(e.target.checked));
  document.getElementById('setting-all-branches').addEventListener('change', e => applyBranchFilterChange(e.target.checked));

  // Commit filter — same two-places-in-sync arrangement as the branch filter.
  function applyCommitFilterChange(checked) {
    state.showAllCommits = checked;
    savePref('showAllCommits', state.showAllCommits);
    document.getElementById('show-all-commits').checked = checked;
    document.getElementById('setting-all-commits').checked = checked;
    updateOtherCommitsUI();
    renderFileList();
    renderAllDiffs();
    renderAgentPanel();
  }
  document.getElementById('show-all-commits').addEventListener('change', e => applyCommitFilterChange(e.target.checked));
  document.getElementById('setting-all-commits').addEventListener('change', e => applyCommitFilterChange(e.target.checked));

  document.getElementById('agent-send').addEventListener('click', sendToAgent);
  document.getElementById('agent-cancel').addEventListener('click', cancelAgentRequest);
  document.getElementById('agent-redraft').addEventListener('click', () => requestPrDraft(''));
  renderAgentPanel();
  refreshAgentStatus();

  document.getElementById('delete-resolved').addEventListener('click', async () => {
    const resolved = state.comments.filter(c => c.resolved);
    if (!resolved.length) return;
    if (!confirm(`Delete ${resolved.length} resolved comment${resolved.length > 1 ? 's' : ''}?`)) return;
    await apiPost('/api/comments/delete-batch', resolved.map(c => c.id));
    await reloadComments();
    renderFileList();
    await renderAllDiffs();
  });

  // Settings panel
  const settingsBtn = document.getElementById('settings-btn');
  const settingsPanel = document.getElementById('settings-panel');
  settingsBtn.addEventListener('click', e => { e.stopPropagation(); settingsPanel.classList.toggle('open'); });
  document.addEventListener('click', () => settingsPanel.classList.remove('open'));
  settingsPanel.addEventListener('click', e => e.stopPropagation());

  const wsCheck = document.getElementById('setting-whitespace');
  const layoutSel = document.getElementById('setting-layout');
  const themeSel = document.getElementById('setting-theme');
  wsCheck.checked = state.ignoreWhitespace;
  layoutSel.value = state.diffLayout;
  themeSel.value = state.theme;
  document.getElementById('show-resolved').checked = state.showResolved;
  document.getElementById('show-all-branches').checked = state.showAllBranches;
  document.getElementById('setting-all-branches').checked = state.showAllBranches;
  document.getElementById('show-all-commits').checked = state.showAllCommits;
  document.getElementById('setting-all-commits').checked = state.showAllCommits;
  const showCommitsCheck = document.getElementById('setting-show-commits');
  showCommitsCheck.checked = state.showCommitMessages;
  updateOtherBranchesUI();
  updateOtherCommitsUI();

  wsCheck.addEventListener('change', () => {
    state.ignoreWhitespace = wsCheck.checked;
    savePref('ignoreWhitespace', state.ignoreWhitespace);
    loadFiles();
  });
  layoutSel.addEventListener('change', () => {
    state.diffLayout = layoutSel.value;
    savePref('diffLayout', state.diffLayout);
    renderAllDiffs();
  });
  themeSel.addEventListener('change', () => {
    state.theme = themeSel.value;
    savePref('theme', state.theme);
    applyTheme(state.theme);
    renderAllDiffs();
  });
  showCommitsCheck.addEventListener('change', () => {
    state.showCommitMessages = showCommitsCheck.checked;
    savePref('showCommitMessages', state.showCommitMessages);
    // Re-fetch so the filter applies before render/badge counting.
    loadFiles();
  });

  const showPrCheck = document.getElementById('setting-show-pr');
  showPrCheck.checked = state.showPrMessage;
  showPrCheck.addEventListener('change', () => {
    state.showPrMessage = showPrCheck.checked;
    savePref('showPrMessage', state.showPrMessage);
    loadFiles();
  });

  const windowSizeInput = document.getElementById('setting-window-size');
  windowSizeInput.value = state.windowSize;
  windowSizeInput.addEventListener('change', () => {
    const v = parseInt(windowSizeInput.value, 10);
    state.windowSize = Number.isFinite(v) && v >= 0 ? v : 0;
    windowSizeInput.value = state.windowSize;
    savePref('windowSize', state.windowSize);
    state.windowStart = 0;
    renderAllDiffs();
  });

  await loadFiles();
  setupCommitsPanel();
  setupFilelistResize();
  // Reflect any hash-restored commit range in the topbar label, and after the
  // first load reflect the resolved review context in the URL so it's
  // immediately copyable as a deeplink even before the user changes anything.
  renderCommitRangeLabel();
  writeHashFromState('replace');
}

function setupFilelistResize() {
  const handle = document.getElementById('filelist-resize');
  const filelist = document.getElementById('filelist');
  let startX, startW;
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    startX = e.clientX;
    startW = filelist.offsetWidth;
    handle.classList.add('dragging');
    const onMove = e => {
      const w = Math.max(120, Math.min(window.innerWidth * 0.5, startW + e.clientX - startX));
      filelist.style.width = w + 'px';
    };
    const onUp = () => {
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
