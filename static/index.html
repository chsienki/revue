<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>revue</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="manifest" href="/manifest.json" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" />
<script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --radius: 4px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }

  /* Dark theme */
  [data-theme="dark"] {
    --bg: #1e1e1e;
    --bg2: #252526;
    --bg3: #2d2d30;
    --border: #3c3c3c;
    --text: #cccccc;
    --text-dim: #858585;
    --accent: #007acc;
    --accent2: #0e639c;
    --add: #1a3a1a;
    --del: #3a1a1a;
    --add-line: #1a3a1a;
    --del-line: #3a1a1a;
    --add-word: #2ea04366;
    --del-word: #f4717466;
    --comment-bg: #3a3200;
    --comment-border: #cca700;
    --comment-text: #cccccc;
  }

  /* Light theme — GitHub-inspired clean white */
  [data-theme="light"] {
    --bg: #ffffff;
    --bg2: #f0f2f5;
    --bg3: #e2e6eb;
    --border: #b0b8c4;
    --text: #1a1a1a;
    --text-dim: #4d5562;
    --accent: #0969da;
    --accent2: #ddf4ff;
    --add: #d1f7d6;
    --del: #ffdce0;
    --add-line: #bcf0c4;
    --del-line: #ffc8ce;
    --add-word: #7ee89a;
    --del-word: #ff818266;
    --comment-bg: #fef3cd;
    --comment-border: #c69500;
    --comment-text: #1a1a1a;
  }

  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 0.8125rem; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Top bar */
  #topbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
    font-size: 0.9375rem;
    line-height: 1;
  }
  #topbar .logo-icon { font-size: 1.125rem; }
  #topbar .logo { font-weight: 700; font-size: 1.125rem; color: var(--text); letter-spacing: 0.5px; white-space: nowrap; }
  #topbar label { color: var(--text-dim); }
  #topbar select {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px 6px;
    font-size: 0.875rem;
    cursor: pointer;
    max-width: 220px;
  }
  #topbar select:focus { outline: 1px solid var(--accent); }
  .arrow { color: var(--text-dim); font-size: 0.9375rem; }
  .topbar-group { display: flex; align-items: baseline; gap: 6px; }
  .topbar-spacer { flex: 1; }

  /* Commits dropdown */
  #commits-btn {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px 6px;
    font-size: 0.875rem;
    font-family: inherit;
    line-height: normal;
    cursor: pointer;
  }
  #commits-btn:hover { border-color: var(--accent); }
  #commits-btn.range-active { border-color: var(--accent); background: var(--accent2); }
  #commit-range-label {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--accent);
    display: none;
    align-items: center;
    gap: 4px;
  }
  #commit-range-label.active { display: flex; }
  #commit-range-label .range-clear {
    cursor: pointer;
    color: var(--text-dim);
    font-size: 0.875rem;
    margin-left: 2px;
  }
  #commit-range-label .range-clear:hover { color: #fff; }
  #commits-panel {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 100;
    min-width: 480px;
    max-height: 320px;
    overflow-y: auto;
    box-shadow: 0 4px 16px #0008;
  }
  #commits-wrapper { position: relative; display: flex; align-items: baseline; gap: 6px; }
  #commits-panel.open { display: block; }
  .commit-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 0.75rem;
    user-select: none;
  }
  .commit-row:hover { background: var(--bg3); }
  .commit-row.selected { background: var(--accent2); }
  .commit-row.in-range { background: rgba(88, 166, 255, 0.1); }
  .commit-hash { font-family: var(--mono); color: var(--accent); min-width: 60px; }
  .commit-subject { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .commit-author { color: var(--text-dim); min-width: 80px; text-align: right; }
  #commit-range-hint { padding: 6px 10px; font-size: 0.6875rem; color: var(--text-dim); border-bottom: 1px solid var(--border); }

  /* Settings dropdown */
  #settings-wrapper { position: relative; }
  #settings-btn {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px 6px;
    font-size: 0.875rem;
    font-family: inherit;
    line-height: normal;
    cursor: pointer;
  }
  #settings-btn:hover { border-color: var(--accent); }
  #settings-panel {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    z-index: 100;
    min-width: 220px;
    padding: 8px 0;
    box-shadow: 0 4px 16px #0008;
  }
  #settings-panel.open { display: block; }
  .settings-item {
    padding: 6px 12px;
    font-size: 0.8125rem;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .settings-item:hover { background: var(--bg3); }
  .settings-item label { cursor: pointer; flex: 1; }
  .settings-item input, .settings-item select { cursor: pointer; }

  /* Main layout */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* File list */
  #filelist {
    width: 260px;
    min-width: 120px;
    max-width: 50vw;
    flex-shrink: 0;
    background: var(--bg2);
    border-right: none;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  #filelist-resize {
    position: absolute;
    top: 0;
    right: 0;
    width: 4px;
    height: 100%;
    cursor: col-resize;
    background: var(--border);
    z-index: 10;
    transition: background 0.15s;
  }
  #filelist-resize:hover, #filelist-resize.dragging { background: var(--accent); }
  #filelist-header {
    padding: 8px 10px;
    font-size: 0.6875rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .file-item {
    padding: 4px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .file-item:hover { background: var(--bg3); }
  .file-item.active { background: var(--accent2); }
  .file-name { flex: 1; font-family: var(--mono); font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-stats { font-size: 0.6875rem; white-space: nowrap; }
  .folder-row {
    padding: 5px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text);
    font-weight: 600;
    user-select: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: var(--bg2);
  }
  .folder-row:hover { background: var(--bg3); }
  .folder-row .folder-arrow { font-size: 0.625rem; width: 12px; display: inline-block; transition: transform 0.15s; }
  .folder-row.collapsed .folder-arrow { transform: rotate(-90deg); }
  .folder-children { }
  .folder-children.hidden { display: none; }
  .folder-children .file-item { }
  .stat-add { color: #4ec94e; }
  .stat-del { color: #f47174; }
  .comment-badge {
    background: var(--comment-border);
    color: #000;
    border-radius: 10px;
    padding: 0 5px;
    font-size: 0.625rem;
    font-weight: 700;
  }

  /* Diff viewer */
  #diffview {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
    position: relative;
  }
  #diffview > *:not(#loading-overlay) { margin: 0; }
  #diffview-content > * { margin: 12px; }
  #diffview-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    font-size: 0.9375rem;
  }
  #loading-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(30, 30, 46, 0.7);
    z-index: 50;
    align-items: center;
    justify-content: center;
    font-size: 0.9375rem;
    color: var(--text-dim);
  }
  #loading-overlay.active { display: flex; }
  .spinner { 
    width: 20px; height: 20px; 
    border: 2px solid var(--border); 
    border-top-color: var(--accent); 
    border-radius: 50%; 
    animation: spin 0.6s linear infinite; 
    margin-right: 10px; 
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* diff2html overrides for dark theme */
  .d2h-wrapper { font-family: var(--mono) !important; font-size: 0.75rem !important; }
  .d2h-file-header { background: var(--bg2) !important; border-color: var(--border) !important; color: var(--text) !important; position: sticky !important; top: 0 !important; z-index: 20 !important; }
  .d2h-file-wrapper { border-color: var(--border) !important; border-radius: var(--radius) !important; }
  .d2h-file-diff { position: relative; z-index: 1; background: var(--bg) !important; container-type: inline-size !important; }
  .d2h-diff-table { background: transparent !important; border-collapse: separate !important; border-spacing: 0 !important; min-width: 100% !important; }
  .d2h-diff-table tr, .d2h-diff-table td, .d2h-diff-table tbody { border: none !important; }
  .d2h-diff-tbody { border: none !important; }
  .d2h-file-side-diff { background: var(--bg) !important; overflow-x: auto !important; container-type: inline-size !important; }
  .d2h-code-wrapper { background: transparent !important; }
  .d2h-code-linenumber, .d2h-code-side-linenumber { display: table-cell !important; background: var(--bg2) !important; border: none !important; box-shadow: 1px 0 0 0 var(--border) !important; color: var(--text-dim) !important; cursor: pointer !important; position: sticky !important; left: 0; z-index: 2; }
  .d2h-code-linenumber { display: flex !important; white-space: nowrap !important; align-items: center !important; position: relative !important; vertical-align: top !important; padding: 2px 0 !important; }
  .d2h-code-linenumber > .line-num1, .d2h-code-linenumber > .line-num2 { min-width: 2em; text-align: right; padding: 0 2px; }
  .d2h-code-linenumber::after, .d2h-code-side-linenumber::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: inherit; z-index: -1; }
  .d2h-code-linenumber:hover, .d2h-code-side-linenumber:hover { background: var(--accent) !important; color: #fff !important; }
  .d2h-code-side-line, .d2h-code-line { background: var(--bg) !important; color: var(--text) !important; padding: 0 0.5em !important; width: auto !important; overflow: hidden !important; }
  .d2h-ins .d2h-code-side-line, .d2h-ins .d2h-code-line { background: var(--add) !important; }
  .d2h-del .d2h-code-side-line, .d2h-del .d2h-code-line { background: var(--del) !important; }
  .d2h-ins .d2h-code-side-line ins, .d2h-ins .d2h-code-line ins { background: var(--add-word) !important; text-decoration: none !important; }
  .d2h-del .d2h-code-side-line del, .d2h-del .d2h-code-line del { background: var(--del-word) !important; text-decoration: none !important; }
  .d2h-ins { background: var(--add) !important; border: none !important; outline: none !important; }
  .d2h-del { background: var(--del) !important; border: none !important; outline: none !important; }
  /* Make hljs backgrounds transparent so diff ins/del colors show through */
  .d2h-code-line .hljs, .d2h-code-side-line .hljs { background: transparent !important; }
  .d2h-ins .hljs, .d2h-del .hljs { background: transparent !important; }
  .d2h-code-side-emptyplaceholder, .d2h-emptyplaceholder { background: var(--bg3) !important; border-color: var(--border) !important; }
  .d2h-code-side-linenumber:empty, .d2h-code-linenumber:empty { background: var(--bg3) !important; box-shadow: none !important; display: table-cell !important; }
  .d2h-ins .d2h-code-linenumber, .d2h-ins .d2h-code-side-linenumber { background: var(--add-line) !important; box-shadow: 1px 0 0 0 var(--border) !important; }
  .d2h-del .d2h-code-linenumber, .d2h-del .d2h-code-side-linenumber { background: var(--del-line) !important; box-shadow: 1px 0 0 0 var(--border) !important; }
  .d2h-info { background: var(--bg3) !important; color: var(--text-dim) !important; border-color: var(--border) !important; padding-top: 4px !important; padding-bottom: 4px !important; }
  .d2h-info .d2h-code-side-line, .d2h-info .d2h-code-line { background: var(--bg3) !important; width: auto !important; padding: 0 0.5em !important; position: sticky !important; left: 0 !important; }
  .d2h-info .d2h-code-linenumber, .d2h-info .d2h-code-side-linenumber { background: var(--bg3) !important; padding: 4px 6px !important; }
  td.d2h-code-linenumber.d2h-info { display: table-cell !important; }
  .d2h-tag { background: var(--bg3) !important; color: var(--text-dim) !important; }

  /* Expand context button on hunk headers */
  .revue-expand-btn { background: none; border: none; color: inherit; cursor: pointer; font-size: 0.75rem; padding: 0; line-height: 1; }
  .revue-expand-bar { background: var(--bg3); color: var(--text-dim); text-align: center; padding: 4px 0; cursor: pointer; font-size: 0.75rem; border-top: 1px solid var(--border); }
  .revue-expand-bar:hover { background: var(--accent); color: #fff; }

  /* Comment threads injected into diff */
  .revue-comment-row { background: var(--comment-bg) !important; border-left: 3px solid var(--comment-border); }
  .revue-spacer-row { background: var(--bg3) !important; border-left: none !important; }
  .revue-comment-row td { padding: 0 !important; width: 0; min-width: 0; overflow: visible; }
  .revue-comment-thread, .revue-comment-input-wrap {
    box-sizing: border-box;
    position: sticky;
    left: 4px;
    margin: 4px 0;
    width: calc(100cqw - 12px);
  }
  .revue-comment-thread {
    padding: 8px 12px;
    font-family: var(--font);
    font-size: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .revue-comment-item {
    background: var(--comment-bg);
    color: var(--comment-text);
    border: 1px solid var(--comment-border);
    border-radius: var(--radius);
    padding: 6px 10px;
    position: relative;
  }
  .revue-comment-body { line-height: 1.5; }
  .revue-comment-author { font-size: 0.625rem; font-weight: 600; color: var(--text-dim); margin-bottom: 2px; }
  .revue-comment-meta { font-size: 0.625rem; color: var(--text-dim); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .revue-comment-meta button {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.625rem;
    padding: 0;
    text-decoration: underline;
  }
  .revue-comment-meta button:hover { color: var(--text); }
  .revue-comment-item.resolved { opacity: 0.45; }
  .revue-replies { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .revue-reply { background: var(--bg3); border-radius: var(--radius); padding: 4px 8px; font-size: 0.6875rem; }
  .revue-reply-input { margin-top: 4px; }
  .revue-reply-input textarea { width: 100%; background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 6px; font-family: var(--font); font-size: 0.6875rem; resize: vertical; min-height: 40px; }
  .revue-reply-input textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  /* Comment input box */
  .revue-comment-input-wrap {
    background: var(--bg2);
    border: 1px solid var(--comment-border);
    border-radius: var(--radius);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .revue-comment-input-wrap textarea {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 8px;
    font-family: var(--font);
    font-size: 0.75rem;
    resize: vertical;
    min-height: 60px;
    width: 100%;
  }
  .revue-comment-input-wrap textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .revue-comment-btn-row { display: flex; gap: 6px; justify-content: flex-end; }
  .revue-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 4px 12px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .revue-btn:hover { background: var(--accent2); }
  .revue-btn.secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .revue-btn.secondary:hover { background: var(--border); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  #loading { padding: 20px; color: var(--text-dim); text-align: center; }
  .show-resolved-wrap { padding: 6px 10px; display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-dim); flex-shrink: 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .show-resolved-wrap input { cursor: pointer; }
  .delete-resolved-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.6875rem; text-decoration: underline; padding: 0; margin-left: auto; }
  .delete-resolved-btn:hover { color: var(--del-text, #f47174); }
  .orphaned-file-item { border-top: 1px solid var(--border); margin-top: 4px; font-style: italic; }
  .orphaned-wrapper { border: 1px solid var(--border); border-radius: var(--radius); margin-top: 8px; }
  .orphaned-comments-list { padding: 8px 0; }
  .orphaned-file-group { margin-bottom: 8px; }
  .orphaned-file-header { font-family: var(--mono); font-size: 0.75rem; color: var(--accent); padding: 4px 12px; font-weight: 600; }
</style>
</head>
<body>

<div id="topbar">
  <span class="logo-icon">🎭</span><span class="logo">revue</span>
  <div class="topbar-group">
    <label>base</label>
    <select id="base-sel"></select>
    <span class="arrow">→</span>
    <label>head</label>
    <select id="head-sel"></select>
  </div>
  <div id="commits-wrapper">
    <button id="commits-btn">Commits ▾</button>
    <span id="commit-range-label"></span>
    <div id="commits-panel">
      <div id="commit-range-hint">Click a commit to view its changes · Shift-click to select a range</div>
      <div id="commits-list"></div>
    </div>
  </div>
  <div class="topbar-spacer"></div>
  <div id="settings-wrapper">
    <button id="settings-btn">⚙ Settings ▾</button>
    <div id="settings-panel">
      <div class="settings-item">
        <label for="setting-theme">Theme</label>
        <select id="setting-theme">
          <option value="auto">Auto (system)</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>
      <div class="settings-item">
        <input type="checkbox" id="setting-whitespace" />
        <label for="setting-whitespace">Ignore whitespace</label>
      </div>
      <div class="settings-item">
        <label for="setting-layout">Diff layout</label>
        <select id="setting-layout">
          <option value="side-by-side" selected>Side by side</option>
          <option value="line-by-line">Inline</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div id="main">
  <div id="filelist">
    <div id="filelist-header">Files</div>
    <div id="filelist-items"></div>
    <div class="show-resolved-wrap">
      <input type="checkbox" id="show-resolved" checked />
      <label for="show-resolved">Show resolved</label>
      <button class="delete-resolved-btn" id="delete-resolved">Delete resolved</button>
    </div>
    <div id="filelist-resize"></div>
  </div>
  <div id="diffview">
    <div id="loading-overlay"><div class="spinner"></div> Loading diffs…</div>
    <div id="diffview-content">
      <div id="diffview-placeholder">← Select a file to review</div>
    </div>
  </div>
</div>

<script>
const API = '';
let state = {
  base: '',
  head: 'HEAD',
  files: [],
  comments: [],
  currentFile: null,
  showResolved: true,
  ignoreWhitespace: false,
  diffLayout: 'side-by-side',
  fileContext: {},  // file -> context line count (default 5)
};

// ── Utilities ──────────────────────────────────────────────────────────────

function savePref(key, val) { document.cookie = `revue_${key}=${encodeURIComponent(val)};path=/;max-age=31536000`; }
function loadPref(key, fallback) {
  const m = document.cookie.match(new RegExp(`revue_${key}=([^;]+)`));
  return m ? decodeURIComponent(m[1]) : fallback;
}

// Restore saved preferences
state.ignoreWhitespace = loadPref('ignoreWhitespace', 'false') === 'true';
state.diffLayout = loadPref('diffLayout', 'side-by-side');
state.showResolved = loadPref('showResolved', 'true') === 'true';
state.theme = loadPref('theme', 'auto');

function applyTheme(theme) {
  const resolved = theme === 'auto'
    ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : theme;
  document.documentElement.setAttribute('data-theme', resolved);
  // Swap highlight.js stylesheet
  const hlLink = document.querySelector('link[href*="highlight.js"]');
  if (hlLink) {
    const style = resolved === 'light' ? 'github' : 'github-dark';
    hlLink.href = `https://cdn.jsdelivr.net/npm/highlight.js@11/styles/${style}.min.css`;
  }
}
applyTheme(state.theme);
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if (state.theme === 'auto') applyTheme('auto');
});

async function api(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`API error ${r.status}: ${await r.text()}`);
  return r.json();
}

async function apiPost(path, body) {
  const r = await fetch(API + path, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`API error ${r.status}: ${await r.text()}`);
  return r.json();
}

async function apiDelete(path) {
  const r = await fetch(API + path, { method: 'DELETE' });
  if (!r.ok) throw new Error(`API error ${r.status}: ${await r.text()}`);
}

// ── Init ───────────────────────────────────────────────────────────────────

async function init() {
  const [branches, cfg] = await Promise.all([api('/api/branches'), api('/api/config')]);
  state.base = cfg.defaultBase;
  state.head = 'HEAD';
  state.logBase = state.base;
  state.logHead = state.head;

  const baseSel = document.getElementById('base-sel');
  const headSel = document.getElementById('head-sel');
  const refs = [state.head, ...branches];
  refs.forEach(b => {
    baseSel.add(new Option(b, b, false, b === state.base));
    headSel.add(new Option(b, b, false, b === state.head));
  });
  // ensure default_base is in list
  if (!refs.includes(state.base)) {
    baseSel.add(new Option(state.base, state.base, false, true));
  }
  baseSel.value = state.base;
  headSel.value = state.head;

  baseSel.addEventListener('change', () => { state.base = baseSel.value; state.logBase = baseSel.value; state.rangeStart = null; state.rangeEnd = null; loadFiles(); });
  headSel.addEventListener('change', () => { state.head = headSel.value; state.logHead = headSel.value; state.rangeStart = null; state.rangeEnd = null; loadFiles(); });

  document.getElementById('show-resolved').addEventListener('change', e => {
    state.showResolved = e.target.checked;
    savePref('showResolved', state.showResolved);
    renderFileList();
    renderAllDiffs();
  });

  document.getElementById('delete-resolved').addEventListener('click', async () => {
    const resolved = state.comments.filter(c => c.resolved);
    if (!resolved.length) return;
    await Promise.all(resolved.map(c => apiDelete(`/api/comments/${c.id}`)));
    state.comments = await api('/api/comments');
    renderFileList();
    await renderAllDiffs();
  });

  // Settings panel
  const settingsBtn = document.getElementById('settings-btn');
  const settingsPanel = document.getElementById('settings-panel');
  settingsBtn.addEventListener('click', e => { e.stopPropagation(); settingsPanel.classList.toggle('open'); });
  document.addEventListener('click', () => settingsPanel.classList.remove('open'));
  settingsPanel.addEventListener('click', e => e.stopPropagation());

  const wsCheck = document.getElementById('setting-whitespace');
  const layoutSel = document.getElementById('setting-layout');
  const themeSel = document.getElementById('setting-theme');
  wsCheck.checked = state.ignoreWhitespace;
  layoutSel.value = state.diffLayout;
  themeSel.value = state.theme;
  document.getElementById('show-resolved').checked = state.showResolved;

  wsCheck.addEventListener('change', () => {
    state.ignoreWhitespace = wsCheck.checked;
    savePref('ignoreWhitespace', state.ignoreWhitespace);
    loadFiles();
  });
  layoutSel.addEventListener('change', () => {
    state.diffLayout = layoutSel.value;
    savePref('diffLayout', state.diffLayout);
    renderAllDiffs();
  });
  themeSel.addEventListener('change', () => {
    state.theme = themeSel.value;
    savePref('theme', state.theme);
    applyTheme(state.theme);
    renderAllDiffs();
  });

  await loadFiles();
  setupCommitsPanel();
  setupFilelistResize();
}

function setupFilelistResize() {
  const handle = document.getElementById('filelist-resize');
  const filelist = document.getElementById('filelist');
  let startX, startW;
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    startX = e.clientX;
    startW = filelist.offsetWidth;
    handle.classList.add('dragging');
    const onMove = e => {
      const w = Math.max(120, Math.min(window.innerWidth * 0.5, startW + e.clientX - startX));
      filelist.style.width = w + 'px';
    };
    const onUp = () => {
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ── Files ──────────────────────────────────────────────────────────────────

async function loadFiles() {
  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('active');
  state.fileContext = {};
  // Yield to let the browser paint the overlay before heavy work
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  state.comments = await api('/api/comments');
  try {
    state.files = await api(`/api/diff?base=${encodeURIComponent(state.base)}&head=${encodeURIComponent(state.head)}&ignoreWhitespace=${state.ignoreWhitespace}`);
  } catch(e) {
    state.files = [];
    document.getElementById('diffview-content').innerHTML = `<div id="diffview-placeholder">Error: ${e.message}</div>`;
    overlay.classList.remove('active');
    return;
  }
  renderFileList();
  await renderAllDiffs();
  renderFileList(); // re-render with accurate badge counts after injection
  overlay.classList.remove('active');
}

function commentCountForFile(file) {
  const ids = state._injectedIds;
  return state.comments.filter(c => c.file === file && (state.showResolved || !c.resolved) && (!ids || ids.has(c.id))).length;
}

function renderFileList() {
  const el = document.getElementById('filelist-items');
  if (!state.files.length) { el.innerHTML = '<div style="padding:12px;color:var(--text-dim)">No changes</div>'; return; }
  el.innerHTML = '';

  // Build tree: { dirs: { name: subtree }, files: [...] }
  const tree = { dirs: {}, files: [] };
  state.files.forEach(f => {
    const parts = f.file.split('/');
    let node = tree;
    for (let i = 0; i < parts.length - 1; i++) {
      const dir = parts[i];
      if (!node.dirs[dir]) node.dirs[dir] = { dirs: {}, files: [] };
      node = node.dirs[dir];
    }
    node.files.push(f);
  });

  // Collapse single-child folder chains: "src" -> "components" -> files becomes "src/components" -> files
  function collapse(node) {
    for (const [name, child] of Object.entries(node.dirs)) {
      collapse(child);
      const dirKeys = Object.keys(child.dirs);
      if (child.files.length === 0 && dirKeys.length === 1) {
        const subName = dirKeys[0];
        const merged = name + '/' + subName;
        node.dirs[merged] = child.dirs[subName];
        delete node.dirs[name];
      }
    }
  }
  collapse(tree);

  function renderNode(node, container, depth = 0) {
    const indent = 10 + depth * 16;
    // Sort: folders first, then files
    const sortedDirs = Object.keys(node.dirs).sort();
    const sortedFiles = [...node.files].sort((a, b) => a.file.localeCompare(b.file));

    sortedDirs.forEach(dirName => {
      const folderRow = document.createElement('div');
      folderRow.className = 'folder-row';
      folderRow.style.paddingLeft = indent + 'px';
      const childFiles = countFiles(node.dirs[dirName]);
      folderRow.innerHTML = `<span class="folder-arrow">▾</span> ${dirName} <span style="margin-left:auto;font-size:0.625rem;color:var(--text-dim)">${childFiles}</span>`;

      const childContainer = document.createElement('div');
      childContainer.className = 'folder-children';

      folderRow.addEventListener('click', () => {
        folderRow.classList.toggle('collapsed');
        childContainer.classList.toggle('hidden');
      });

      container.appendChild(folderRow);
      container.appendChild(childContainer);
      renderNode(node.dirs[dirName], childContainer, depth + 1);
    });

    sortedFiles.forEach(f => {
      const cnt = commentCountForFile(f.file);
      const div = document.createElement('div');
      const fileName = f.file.split('/').pop();
      div.className = 'file-item' + (f.file === state.currentFile ? ' active' : '');
      div.style.paddingLeft = (indent + 16) + 'px';
      div.innerHTML = `
        <span class="file-name" title="${f.file}">${fileName}</span>
        <span class="file-stats"><span class="stat-add">+${f.additions}</span> <span class="stat-del">-${f.deletions}</span></span>
        ${cnt ? `<span class="comment-badge">${cnt}</span>` : ''}
      `;
      div.addEventListener('click', () => {
        state.currentFile = f.file;
        renderFileList();
        const target = document.getElementById(`file-${encodeFileId(f.file)}`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      container.appendChild(div);
    });
  }

  function countFiles(node) {
    let count = node.files.length;
    for (const child of Object.values(node.dirs)) count += countFiles(child);
    return count;
  }

  // If everything is under one root folder, skip it
  const topDirs = Object.keys(tree.dirs);
  if (tree.files.length === 0 && topDirs.length === 1) {
    renderNode(tree.dirs[topDirs[0]], el);
  } else {
    renderNode(tree, el);
  }

  // Show orphaned comment count in file tree as a virtual entry
  const ids = state._injectedIds;
  const orphanedForTree = state.comments.filter(c => (state.showResolved || !c.resolved) && (!ids || !ids.has(c.id)));
  if (orphanedForTree.length) {
    const div = document.createElement('div');
    div.className = 'file-item orphaned-file-item' + (state.currentFile === '__orphaned__' ? ' active' : '');
    div.style.paddingLeft = '26px';
    div.innerHTML = `
      <span class="file-name">Other comments</span>
      <span class="comment-badge">${orphanedForTree.length}</span>
    `;
    div.addEventListener('click', () => {
      state.currentFile = '__orphaned__';
      renderFileList();
      const target = document.getElementById('file-__orphaned__');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    el.appendChild(div);
  }
}

// ── Diff rendering ─────────────────────────────────────────────────────────

async function renderAllDiffs() {
  const scrollEl = document.getElementById('diffview');
  const scrollTop = scrollEl?.scrollTop ?? 0;
  const dv = document.getElementById('diffview-content');
  if (!state.files.length) {
    dv.innerHTML = '<div id="diffview-placeholder">No changes</div>';
    return;
  }

  dv.innerHTML = '<div id="d2h-target"></div>';
  const target = document.getElementById('d2h-target');
  const isSxS = state.diffLayout === 'side-by-side';

  if (isSxS) {
    // Per-file rendering: use inline for pure adds/deletes, SxS for modifications
    for (const f of state.files) {
      if (!f.patch) continue;
      const isAddOnly = f.deletions === 0;
      const isDeleteOnly = f.additions === 0;
      const format = (isAddOnly || isDeleteOnly) ? 'line-by-line' : 'side-by-side';
      const fileTarget = document.createElement('div');
      target.appendChild(fileTarget);
      const ui = new Diff2HtmlUI(fileTarget, f.patch, {
        drawFileList: false,
        matching: 'lines',
        outputFormat: format,
        renderNothingWhenEmpty: false,
        highlight: true,
        colorScheme: document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark',
      });
      await ui.draw();
    }
  } else {
    // Inline: render all files together
    const fullDiff = state.files.map(f => f.patch).filter(Boolean).join('\n');
    const ui = new Diff2HtmlUI(target, fullDiff, {
      drawFileList: false,
      matching: 'lines',
      outputFormat: 'line-by-line',
      renderNothingWhenEmpty: false,
      highlight: true,
      colorScheme: document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark',
    });
    await ui.draw();
  }

  // Add anchor IDs to each file wrapper and attach per-file handlers
  const fileWrappers = target.querySelectorAll('.d2h-file-wrapper');
  const injectedIds = new Set();
  state.files.forEach((f, i) => {
    if (i >= fileWrappers.length) return;
    fileWrappers[i].id = `file-${encodeFileId(f.file)}`;
    const injected = injectComments(f.file, f.patch, fileWrappers[i]);
    injected.forEach(id => injectedIds.add(id));
    attachLineClickHandlers(f.file, f.patch, fileWrappers[i]);
    attachExpandButtons(f.file, fileWrappers[i]);
  });
  state._injectedIds = injectedIds;

  // Orphaned = comments on files not in diff OR comments on diff files but not on visible lines
  const visibleComments = state.comments.filter(c => (state.showResolved || !c.resolved));
  const orphaned = visibleComments.filter(c => !injectedIds.has(c.id));
  if (orphaned.length) {
    const section = document.createElement('div');
    section.className = 'd2h-file-wrapper orphaned-wrapper';
    section.id = 'file-__orphaned__';

    // Group by file
    const byFile = {};
    orphaned.forEach(c => {
      if (!byFile[c.file]) byFile[c.file] = [];
      byFile[c.file].push(c);
    });

    let html = `<div class="d2h-file-header" style="position:sticky;top:0;z-index:20">
      <span style="font-weight:600">Other comments</span>
      <span style="margin-left:8px;color:var(--text-dim);font-size:0.75rem">${orphaned.length} comment${orphaned.length > 1 ? 's' : ''} not visible in the diff</span>
      <button class="delete-resolved-btn" id="delete-all-orphaned" style="margin-left:auto;font-size:0.75rem">Delete all</button>
    </div><div class="orphaned-comments-list">`;

    for (const [file, comments] of Object.entries(byFile).sort((a, b) => a[0].localeCompare(b[0]))) {
      html += `<div class="orphaned-file-group">
        <div class="orphaned-file-header">${escHtml(file)}</div>`;
      comments.forEach(c => {
        html += `<div class="revue-comment-item${c.resolved ? ' resolved' : ''}" data-orphan-id="${c.id}" style="margin:4px 12px">
          <div class="revue-comment-body">${escHtml(c.body)}</div>
          <div class="revue-comment-meta">
            <span>Line ${c.line}</span>
            <span>${new Date(c.created).toLocaleString()}</span>
            <button class="resolve-btn">${c.resolved ? 'Unresolve' : 'Resolve'}</button>
            <button class="delete-btn">Delete</button>
          </div>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
    section.innerHTML = html;

    // Wire up buttons
    section.querySelector('#delete-all-orphaned').addEventListener('click', async () => {
      await Promise.all(orphaned.map(c => apiDelete(`/api/comments/${c.id}`)));
      state.comments = await api('/api/comments');
      renderFileList();
      await renderAllDiffs();
    });
    section.querySelectorAll('[data-orphan-id]').forEach(el => {
      const id = el.dataset.orphanId;
      const c = orphaned.find(x => x.id === id);
      if (!c) return;
      el.querySelector('.resolve-btn').addEventListener('click', async () => {
        await apiPost('/api/comments', {...c, resolved: !c.resolved});
        state.comments = await api('/api/comments');
        renderFileList();
        await renderAllDiffs();
      });
      el.querySelector('.delete-btn').addEventListener('click', async () => {
        await apiDelete(`/api/comments/${id}`);
        state.comments = await api('/api/comments');
        renderFileList();
        await renderAllDiffs();
      });
    });

    target.appendChild(section);
  }
  if (scrollEl) scrollEl.scrollTop = scrollTop;
}

// ── Comment injection ──────────────────────────────────────────────────────

function injectComments(file, patch, container) {
  const injectedIds = [];
  const lineComments = {};
  state.comments
    .filter(c => c.file === file)
    .filter(c => state.showResolved || !c.resolved)
    .forEach(c => {
      const key = `${c.side}:${c.line}`;
      if (!lineComments[key]) lineComments[key] = [];
      lineComments[key].push(c);
    });

  if (!Object.keys(lineComments).length) return injectedIds;

  // Find all line number cells and inject threads after their <tr>
  const isSideBySide = !!container.querySelector('.d2h-file-side-diff');
  if (isSideBySide) {
    const panels = container.querySelectorAll('.d2h-file-side-diff');
    const leftTbody = panels[0].querySelector('tbody');
    const rightTbody = panels[1].querySelector('tbody');
    const leftRows = Array.from(leftTbody.querySelectorAll(':scope > tr'));
    const rightRows = Array.from(rightTbody.querySelectorAll(':scope > tr'));

    // Process both sides, collecting insertions to apply in reverse order
    const insertions = [];
    for (let i = 0; i < leftRows.length; i++) {
      for (const [rows, side] of [[leftRows, 'left'], [rightRows, 'right']]) {
        const tr = rows[i];
        const cell = tr.querySelector('td.d2h-code-side-linenumber');
        if (!cell) continue;
        const lineNum = parseInt(cell.textContent.trim(), 10);
        if (isNaN(lineNum)) continue;
        const key = `${side}:${lineNum}`;
        const comments = lineComments[key];
        if (comments && !cell.dataset.injected) {
          cell.dataset.injected = '1';
          insertions.push({ index: i, side, comments });
        }
      }
    }

    // Apply insertions in reverse so indices stay valid
    insertions.sort((a, b) => b.index - a.index);
    for (const ins of insertions) {
      const leftTr = leftTbody.querySelectorAll(':scope > tr')[ins.index];
      const rightTr = rightTbody.querySelectorAll(':scope > tr')[ins.index];
      const commentRow = document.createElement('tr');
      commentRow.className = 'revue-comment-row';
      const colCount = leftTr.cells.length || 2;
      commentRow.innerHTML = `<td colspan="${colCount}"><div class="revue-comment-thread"></div></td>`;

      const spacerRow = document.createElement('tr');
      spacerRow.className = 'revue-comment-row revue-spacer-row';
      spacerRow.innerHTML = `<td colspan="${colCount}"></td>`;

      if (ins.side === 'left') {
        leftTr.after(commentRow);
        rightTr.after(spacerRow);
      } else {
        rightTr.after(commentRow);
        leftTr.after(spacerRow);
      }

      const threadDiv = commentRow.querySelector('.revue-comment-thread');
      ins.comments.forEach(c => { injectedIds.push(c.id); renderCommentItem(threadDiv, c, file); });

      // Sync spacer height with comment row
      const syncHeight = () => { spacerRow.style.height = commentRow.offsetHeight + 'px'; };
      syncHeight();
      const ro = new ResizeObserver(syncHeight);
      ro.observe(commentRow);
    }
  } else {
    const rows = container.querySelectorAll('tr');
    rows.forEach(tr => {
      // Inline/unified: single cell with .line-num1 (old) and .line-num2 (new)
      const cell = tr.querySelector('td.d2h-code-linenumber');
      if (!cell || cell.dataset.injected) return;
      const num1El = cell.querySelector('.line-num1');
      const num2El = cell.querySelector('.line-num2');
      const oldNum = num1El ? parseInt(num1El.textContent.trim(), 10) : NaN;
      const newNum = num2El ? parseInt(num2El.textContent.trim(), 10) : NaN;
      const matched = [];
      if (!isNaN(newNum) && lineComments[`right:${newNum}`]) matched.push(...lineComments[`right:${newNum}`]);
      if (!isNaN(oldNum) && lineComments[`left:${oldNum}`]) matched.push(...lineComments[`left:${oldNum}`]);
      if (matched.length) {
        cell.dataset.injected = '1';
        const threadRow = document.createElement('tr');
        threadRow.className = 'revue-comment-row';
        const colCount = tr.cells.length || 4;
        threadRow.innerHTML = `<td colspan="${colCount}"><div class="revue-comment-thread"></div></td>`;
        tr.after(threadRow);
        const threadDiv = threadRow.querySelector('.revue-comment-thread');
        matched.forEach(c => { injectedIds.push(c.id); renderCommentItem(threadDiv, c, file); });
      }
    });
  }
  return injectedIds;
}

function renderCommentItem(container, c, file) {
  const div = document.createElement('div');
  div.className = 'revue-comment-item' + (c.resolved ? ' resolved' : '');
  div.dataset.id = c.id;

  const authorLabel = c.author === 'copilot' ? '🤖 Copilot' : `👤 ${c.author || 'user'}`;
  div.innerHTML = `
    <div class="revue-comment-author">${escHtml(authorLabel)}</div>
    <div class="revue-comment-body">${escHtml(c.body)}</div>
    <div class="revue-comment-meta">
      <span>Line ${c.line}</span>
      <span>${new Date(c.created).toLocaleString()}</span>
      <button class="reply-btn">Reply</button>
      <button class="resolve-btn">${c.resolved ? 'Unresolve' : 'Resolve'}</button>
      <button class="delete-btn">Delete</button>
    </div>
    <div class="revue-replies"></div>
  `;

  // Render existing replies
  const repliesDiv = div.querySelector('.revue-replies');
  if (c.replies?.length) {
    c.replies.forEach(r => {
      const rAuthor = r.author === 'copilot' ? '🤖 Copilot' : `👤 ${r.author || 'user'}`;
      const replyEl = document.createElement('div');
      replyEl.className = 'revue-reply';
      replyEl.innerHTML = `
        <div class="revue-comment-author">${escHtml(rAuthor)}</div>
        <div class="revue-comment-body">${escHtml(r.body)}</div>
        <div class="revue-comment-meta"><span>${new Date(r.created).toLocaleString()}</span></div>
      `;
      repliesDiv.appendChild(replyEl);
    });
  }

  div.querySelector('.reply-btn').addEventListener('click', () => {
    // Don't add if already has an open reply input
    if (div.querySelector('.revue-reply-input')) return;
    const inputDiv = document.createElement('div');
    inputDiv.className = 'revue-reply-input';
    inputDiv.innerHTML = `
      <textarea placeholder="Write a reply…" rows="2"></textarea>
      <div class="revue-comment-btn-row">
        <button class="revue-btn secondary cancel-reply-btn">Cancel</button>
        <button class="revue-btn save-reply-btn">Reply</button>
      </div>
    `;
    repliesDiv.appendChild(inputDiv);
    inputDiv.querySelector('textarea').focus();
    inputDiv.querySelector('.cancel-reply-btn').addEventListener('click', () => inputDiv.remove());
    inputDiv.querySelector('.save-reply-btn').addEventListener('click', async () => {
      const body = inputDiv.querySelector('textarea').value.trim();
      if (!body) return;
      await apiPost(`/api/comments/${c.id}/replies`, { author: 'user', body });
      state.comments = await api('/api/comments');
      renderFileList();
      await renderAllDiffs();
    });
  });
  div.querySelector('.resolve-btn').addEventListener('click', async () => {
    await apiPost('/api/comments', {...c, resolved: !c.resolved});
    state.comments = await api('/api/comments');
    renderFileList();
    await renderAllDiffs();
  });
  div.querySelector('.delete-btn').addEventListener('click', async () => {
    await apiDelete(`/api/comments/${c.id}`);
    state.comments = await api('/api/comments');
    renderFileList();
    await renderAllDiffs();
  });
  container.appendChild(div);
}

// ── Line click → comment box ───────────────────────────────────────────────

function attachLineClickHandlers(file, patch, container) {
  const lines = patch.split('\n');
  const newLineMap = buildLineMap(lines, 'new');
  const oldLineMap = buildLineMap(lines, 'old');
  const isSideBySide = !!container.querySelector('.d2h-file-side-diff');

  container.querySelectorAll('td.d2h-code-side-linenumber, td.d2h-code-linenumber').forEach(cell => {
    if (isSideBySide) {
      cell.addEventListener('click', () => {
        const lineNum = parseInt(cell.textContent.trim(), 10);
        if (isNaN(lineNum)) return;
        const tr = cell.closest('tr');
        if (!tr) return;
        if (tr.nextSibling?.classList?.contains('revue-input-row')) return;
        const side = detectSide(cell);
        const lineContent = (side === 'left' ? oldLineMap[lineNum] : newLineMap[lineNum]) || '';
        showCommentInput(tr, file, lineNum, lineContent, side);
      });
    } else {
      // Inline: attach click to individual .line-num1 / .line-num2 divs
      const num1 = cell.querySelector('.line-num1');
      const num2 = cell.querySelector('.line-num2');
      const handler = (numEl, side) => {
        if (!numEl) return;
        numEl.style.cursor = 'pointer';
        numEl.addEventListener('click', (e) => {
          e.stopPropagation();
          const lineNum = parseInt(numEl.textContent.trim(), 10);
          if (isNaN(lineNum)) return;
          const tr = cell.closest('tr');
          if (!tr) return;
          if (tr.nextSibling?.classList?.contains('revue-input-row')) return;
          const lineContent = (side === 'left' ? oldLineMap[lineNum] : newLineMap[lineNum]) || '';
          showCommentInput(tr, file, lineNum, lineContent, side);
        });
      };
      handler(num1, 'left');
      handler(num2, 'right');
    }
  });
}

function attachExpandButtons(file, container) {
  const isSxS = !!container.querySelector('.d2h-file-side-diff');

  const expandHandler = async (e) => {
    e.stopPropagation();
    const currentContext = state.fileContext[file] || 5;
    const newContext = currentContext + 5;
    state.fileContext[file] = newContext;
    const updated = await api(`/api/file-diff?base=${encodeURIComponent(state.base)}&head=${encodeURIComponent(state.head)}&file=${encodeURIComponent(file)}&ignoreWhitespace=${state.ignoreWhitespace}&context=${newContext}`);
    if (!updated) return;
    const idx = state.files.findIndex(f => f.file === file);
    if (idx >= 0) state.files[idx] = updated;
    renderFileList();
    await renderAllDiffs();
    const target = document.getElementById(`file-${encodeFileId(file)}`);
    if (target) target.scrollIntoView({ block: 'start' });
  };

  const makeBtn = (arrow) => {
    const btn = document.createElement('button');
    btn.className = 'revue-expand-btn';
    btn.textContent = arrow;
    btn.title = 'Show more context';
    btn.addEventListener('click', expandHandler);
    return btn;
  };

  const setupExpandCell = (cell, arrow) => {
    cell.appendChild(makeBtn(arrow));
    cell.title = 'Show more context';
    cell.addEventListener('click', expandHandler);
  };

  // Add ↕ buttons on @@ hunk header line number cells
  const numCellSelector = isSxS
    ? '.d2h-file-side-diff:first-child td.d2h-code-side-linenumber.d2h-info'
    : 'td.d2h-code-linenumber.d2h-info';
  container.querySelectorAll(numCellSelector).forEach(numCell => {
    setupExpandCell(numCell, '↕');
  });

  // Add ↓ button at the bottom of the file
  if (isSxS) {
    // Add a full-width bar after the two panels
    const filesDiff = container.querySelector('.d2h-files-diff');
    if (filesDiff) {
      const bar = document.createElement('div');
      bar.className = 'revue-expand-bar';
      bar.title = 'Show more context';
      bar.textContent = '↓';
      bar.addEventListener('click', expandHandler);
      filesDiff.after(bar);
    }
  } else {
    const tb = container.querySelector('tbody');
    if (tb) {
      const rows = Array.from(tb.querySelectorAll(':scope > tr'));
      if (rows.length) {
        const lastRow = rows[rows.length - 1];
        if (!lastRow.querySelector('.d2h-info')) {
          const expandRow = document.createElement('tr');
          const numTd = document.createElement('td');
          numTd.className = 'd2h-code-linenumber d2h-info';
          setupExpandCell(numTd, '↓');
          expandRow.appendChild(numTd);
          const codeTd = document.createElement('td');
          codeTd.className = 'd2h-info';
          expandRow.appendChild(codeTd);
          tb.appendChild(expandRow);
        }
      }
    }
  }
}

function detectSide(cell) {
  // Side-by-side: check which panel the cell is in
  const sidePanel = cell.closest('.d2h-file-side-diff');
  if (sidePanel) {
    const wrapper = sidePanel.closest('.d2h-file-wrapper');
    const panels = wrapper.querySelectorAll('.d2h-file-side-diff');
    return sidePanel === panels[0] ? 'left' : 'right';
  }
  // Unified: check if the cell is the old (first) or new (second) line number column
  const tr = cell.closest('tr');
  const lineNumCells = tr.querySelectorAll('td.d2h-code-linenumber');
  if (lineNumCells.length >= 2 && cell === lineNumCells[0]) return 'left';
  return 'right';
}

function buildLineMap(lines, which) {
  const map = {};
  let oldLine = 0, newLine = 0;
  lines.forEach(l => {
    if (l.startsWith('@@')) {
      const m = l.match(/@@ -(\d+)(?:,\d+)? \+(\d+)/);
      if (m) { oldLine = parseInt(m[1], 10) - 1; newLine = parseInt(m[2], 10) - 1; }
    } else if (l.startsWith('+')) {
      newLine++;
      if (which === 'new') map[newLine] = l.slice(1);
    } else if (l.startsWith('-')) {
      oldLine++;
      if (which === 'old') map[oldLine] = l.slice(1);
    } else {
      oldLine++;
      newLine++;
      map[which === 'old' ? oldLine : newLine] = l.slice(1);
    }
  });
  return map;
}

function findOppositeRow(tr) {
  const panel = tr.closest('.d2h-file-side-diff');
  if (!panel) return null;
  const wrapper = panel.closest('.d2h-file-wrapper');
  const panels = wrapper.querySelectorAll('.d2h-file-side-diff');
  const otherPanel = panel === panels[0] ? panels[1] : panels[0];
  const myRows = Array.from(panel.querySelectorAll('tbody > tr'));
  const otherRows = Array.from(otherPanel.querySelectorAll('tbody > tr'));
  const idx = myRows.indexOf(tr);
  return idx >= 0 && idx < otherRows.length ? otherRows[idx] : null;
}

function insertWithSpacer(tr, newRow) {
  const oppTr = findOppositeRow(tr);
  tr.after(newRow);
  if (oppTr) {
    const spacer = document.createElement('tr');
    spacer.className = 'revue-comment-row revue-spacer-row';
    spacer.innerHTML = `<td colspan="${oppTr.cells.length || 2}"></td>`;
    oppTr.after(spacer);
    const syncHeight = () => { spacer.style.height = newRow.offsetHeight + 'px'; };
    syncHeight();
    const ro = new ResizeObserver(syncHeight);
    ro.observe(newRow);
    // Store spacer ref for cleanup
    newRow._spacerRow = spacer;
    newRow._resizeObserver = ro;
  }
}

function showCommentInput(tr, file, line, lineContent, side) {
  const inputRow = document.createElement('tr');
  inputRow.className = 'revue-input-row revue-comment-row';
  const colCount = tr.cells.length || 4;
  inputRow.innerHTML = `<td colspan="${colCount}"></td>`;
  const isSxS = !!tr.closest('.d2h-file-side-diff');
  if (isSxS) {
    insertWithSpacer(tr, inputRow);
  } else {
    tr.after(inputRow);
  }
  const td = inputRow.querySelector('td');
  const wrap = document.createElement('div');
  wrap.className = 'revue-comment-input-wrap';
  wrap.innerHTML = `
    <div style="font-size:0.6875rem;color:var(--text-dim)">Comment on line ${line}: <code style="color:var(--text)">${escHtml(lineContent.trim().slice(0,80))}</code></div>
    <textarea placeholder="Leave a comment…" autofocus></textarea>
    <div class="revue-comment-btn-row">
      <button class="revue-btn secondary cancel-btn">Cancel</button>
      <button class="revue-btn save-btn">Save Comment</button>
    </div>
  `;
  td.appendChild(wrap);
  wrap.querySelector('textarea').focus();

  const cleanup = () => {
    if (inputRow._resizeObserver) inputRow._resizeObserver.disconnect();
    if (inputRow._spacerRow) inputRow._spacerRow.remove();
    inputRow.remove();
  };
  wrap.querySelector('.cancel-btn').addEventListener('click', cleanup);
  wrap.querySelector('.save-btn').addEventListener('click', async () => {
    const body = wrap.querySelector('textarea').value.trim();
    if (!body) return;
    await apiPost('/api/comments', { file, line, line_content: lineContent, base: state.base, head: state.head, side, body, author: 'user' });
    state.comments = await api('/api/comments');
    cleanup();
    renderFileList();
    await renderAllDiffs();
  });
}

// ── Commits panel ──────────────────────────────────────────────────────────

async function setupCommitsPanel() {
  const btn = document.getElementById('commits-btn');
  const panel = document.getElementById('commits-panel');
  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) await loadCommits();
  });
  document.addEventListener('click', () => panel.classList.remove('open'));
  panel.addEventListener('click', e => e.stopPropagation());
}

async function loadCommits() {
  const list = document.getElementById('commits-list');
  list.innerHTML = '<div style="padding:8px;color:var(--text-dim)">Loading…</div>';
  try {
    state.commits = await api(`/api/log?base=${encodeURIComponent(state.logBase)}&head=${encodeURIComponent(state.logHead)}`);
    renderCommitList();
  } catch(e) {
    list.innerHTML = `<div style="padding:8px;color:var(--text-dim)">Error: ${e.message}</div>`;
  }
}

function renderCommitList() {
  const list = document.getElementById('commits-list');
  const commits = state.commits || [];
  list.innerHTML = '';
  if (!commits.length) { list.innerHTML = '<div style="padding:8px;color:var(--text-dim)">No commits</div>'; return; }

  // Determine selected range indices
  let startIdx = -1, endIdx = -1;
  if (state.rangeStart) startIdx = commits.findIndex(c => c.hash === state.rangeStart);
  if (state.rangeEnd) endIdx = commits.findIndex(c => c.hash === state.rangeEnd);
  if (startIdx > endIdx && endIdx >= 0) { const t = startIdx; startIdx = endIdx; endIdx = t; }

  commits.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'commit-row';
    if (i === startIdx || i === endIdx) row.classList.add('selected');
    else if (startIdx >= 0 && endIdx >= 0 && i > startIdx && i < endIdx) row.classList.add('in-range');
    row.innerHTML = `<span class="commit-hash">${escHtml(c.hash.slice(0, 8))}</span><span class="commit-subject" title="${escHtml(c.message)}">${escHtml(c.message)}</span>`;
    if (c.hash.startsWith('~')) {
      row.style.opacity = '0.6';
      row.style.cursor = 'default';
    } else {
      row.addEventListener('click', (e) => {
        e.preventDefault();
        if (e.shiftKey) {
          window.getSelection()?.removeAllRanges();
          state.rangeEnd = c.hash;
        } else {
          state.rangeStart = c.hash;
          state.rangeEnd = null;
        }
        applyCommitRange();
        renderCommitList();
      });
    }
    list.appendChild(row);
  });
}

function applyCommitRange() {
  const commits = state.commits || [];
  const btn = document.getElementById('commits-btn');
  const label = document.getElementById('commit-range-label');
  if (!state.rangeStart) return;

  if (!state.rangeEnd) {
    // Single commit: diff from logBase...commit
    state.base = state.logBase;
    state.head = state.rangeStart;
    btn.classList.add('range-active');
    label.className = 'active';
    label.innerHTML = `${state.rangeStart.slice(0, 8)} <span class="range-clear" title="Clear selection">✕</span>`;
  } else {
    // Range: find the older and newer commits
    let si = commits.findIndex(c => c.hash === state.rangeStart);
    let ei = commits.findIndex(c => c.hash === state.rangeEnd);
    // commits are newest-first, so higher index = older
    if (si > ei) { const t = si; si = ei; ei = t; }
    const newerHash = commits[si].hash;
    const olderHash = commits[ei].hash;
    state.base = olderHash + '^';
    state.head = newerHash;
    btn.classList.add('range-active');
    label.className = 'active';
    label.innerHTML = `${olderHash.slice(0, 8)} → ${newerHash.slice(0, 8)} <span class="range-clear" title="Clear selection">✕</span>`;
  }
  label.querySelector('.range-clear')?.addEventListener('click', (e) => {
    e.stopPropagation();
    state.rangeStart = null;
    state.rangeEnd = null;
    state.base = state.logBase;
    state.head = state.logHead;
    btn.classList.remove('range-active');
    label.className = '';
    label.innerHTML = '';
    loadFiles();
  });
  document.getElementById('commits-panel').classList.remove('open');
  loadFiles();
}

// ── Helpers ────────────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function encodeFileId(file) {
  return file.replace(/[^a-zA-Z0-9_-]/g, '_');
}

// ── Boot ───────────────────────────────────────────────────────────────────
init().catch(e => {
  document.getElementById('diffview-content').innerHTML = `<div id="diffview-placeholder" style="color:#f47174">Failed to load: ${e.message}</div>`;
});
</script>
