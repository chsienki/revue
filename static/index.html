    document.addEventListener('mouseup', onUp);
  });
}

// ── Background change polling ─────────────────────────────────────────────

(function startPolling() {
  let lastDiffHash = null;
  let lastCommitsHash = null;
  let lastCommentsJson = null;
  let lastReposJson = null;
  let dismissed = false;
  let pollFailures = 0;

  // Called by UI actions that modify comments, so polling doesn't flag our own changes
  window.resetCommentsBaseline = () => {
    lastCommentsJson = JSON.stringify(state.comments);
  };

  const banner = document.getElementById('changes-banner');
  const msg = document.getElementById('changes-msg');

  document.getElementById('changes-reload-btn').addEventListener('click', () => {
    banner.classList.remove('active');
    dismissed = false;
    loadFiles();
  });
  document.getElementById('changes-dismiss').addEventListener('click', () => {
    banner.classList.remove('active');
    dismissed = true;
  });

  async function poll() {
    if (state.restarting) return;
    // init() sets the branch context; polling before that would fingerprint an
    // unresolvable range and read the difference as history changing.
    if (!state.logBase) return;
    try {
      // Pick up repos added/removed by another `revue <path>` launch so the
      // selector stays live without a manual refresh.
      try {
        const repoData = await api('/api/repos');
        const reposJson = JSON.stringify(repoData.repos);
        if (lastReposJson !== null && reposJson !== lastReposJson) {
          state.repos = repoData.repos;
          if (!state.repos.some(r => r.path === state.repo)) {
            await selectRepo(repoData.primary || (state.repos[0] && state.repos[0].path));
          } else {
            renderRepoSelector();
          }
        }
        lastReposJson = reposJson;
      } catch { /* ignore */ }

      // Check for current-branch changes (e.g. user ran `git checkout` in another terminal)
      let branchChanged = false;
      try {
        const cb = await api('/api/current-branch');
        const newBranch = cb.currentBranch || null;
        if (newBranch !== state.currentBranch) {
          state.currentBranch = newBranch;
          branchChanged = true;
        }
      } catch { /* ignore */ }

      // Check for comment changes (new replies, new comments)
      const comments = await api('/api/comments');
      const commentsJson = JSON.stringify(comments);
      const commentsChanged = lastCommentsJson !== null && commentsJson !== lastCommentsJson;
      lastCommentsJson = commentsJson;

      if (commentsChanged) state.comments = comments;

      // Branch changes need a full re-render for the new branch filter; comment
      // changes apply themselves (deferred if the user is mid-edit) so replies
      // land without a reload step.
      if (branchChanged) {
        state.commentsDirty = false;
        updateOtherBranchesUI();
        updateOtherCommitsUI();
        renderFileList();
        renderAllDiffs();
      } else if (commentsChanged || state.commentsDirty) {
        await applyLiveComments();
      }
      if (branchChanged || commentsChanged) renderAgentPanel();

      // Refresh the agent hand-off panel (attached / working / finished)
      await refreshAgentStatus();

      // Check for file/diff changes
      const changes = await api(`/api/changes-hash?base=${encodeURIComponent(state.base)}&head=${encodeURIComponent(state.head)}`
        + `&commitBase=${encodeURIComponent(state.logBase)}&commitHead=${encodeURIComponent(state.logHead)}`);
      const hash = changes.hash;
      const diffChanged = lastDiffHash !== null && hash !== lastDiffHash;
      lastDiffHash = hash;

      // A rewrite is tracked separately from the tree: rebasing, rewording or
      // squashing can leave every file byte-identical, so the tree hash alone
      // would report nothing at all while the view silently goes stale.
      const commitsChanged = lastCommitsHash !== null && changes.commits !== lastCommitsHash;
      lastCommitsHash = changes.commits;

      // A rewrite and the remap describing it arrive separately, so keep
      // checking until the pin can be followed rather than only on the tick the
      // commit set moved.
      if (commitsChanged || state.rewritePending) {
        // Follow the rewrite rather than banner it: the commits the user picked
        // still exist, so asking them to reload and re-find them is busywork.
        // The reload refreshes state.rangeCommits, which is also what lets
        // comments remapped onto the new shas reappear.
        const outcome = await followHistoryRewrite();
        state.rewritePending = outcome === 'pending';
        if (commitsChanged || outcome === 'followed') {
          await applyLiveFiles();
          // Re-pointing the range moves base/head, so the tree fingerprint taken
          // against the old endpoints would read as "files changed on disk" on
          // the next tick. Re-baseline instead of bannering our own navigation.
          try {
            const rebased = await api(`/api/changes-hash?base=${encodeURIComponent(state.base)}&head=${encodeURIComponent(state.head)}`
              + `&commitBase=${encodeURIComponent(state.logBase)}&commitHead=${encodeURIComponent(state.logHead)}`);
            lastDiffHash = rebased.hash;
            lastCommitsHash = rebased.commits;
          } catch { lastDiffHash = null; lastCommitsHash = null; }
        }
      }

      // Banner is only for changes we can't safely apply under the user: files
      // rewritten on disk, or a checkout that moved the review out from under them.
      if (!dismissed && (diffChanged || branchChanged)) {
        const parts = [];
        if (diffChanged) parts.push('Files changed on disk');
        if (branchChanged) parts.push(`Branch changed to "${state.currentBranch || 'detached HEAD'}"`);
        msg.textContent = parts.join(' · ');
        banner.classList.add('active');
      }

      // A restart can be quick enough that no poll ever fails, so trust the
      // reported version rather than an observed outage: a different server on
      // the same port means this page's frontend is stale.
      try {
        const status = await api('/api/update-status');
        if (state.version && status.version && status.version !== state.version) {
          location.reload();
          return;
        }
        renderUpdateBanner(status);
      } catch { /* best-effort */ }

      pollFailures = 0;
    } catch (e) {
      // Only a transport failure means the server went away. An endpoint
      // returning an error -- a transient git failure during a rebase, say --
      // says nothing about whether revue is still there.
      if (e instanceof TypeError) {
        if (++pollFailures >= 2) watchForRestart(null);
      } else {
        pollFailures = 0;
      }
    }
  }

  // Initialize baselines without showing banner
  poll();
  setInterval(poll, 5000);
})();

// ── Files ──────────────────────────────────────────────────────────────────

async function loadFiles() {
  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('active');
  state.fileContext = {};
  state.windowStart = 0;
  // Check if base ref is stale (non-blocking, runs in parallel)
  checkBaseRefStatus();
  // Yield to let the browser paint the overlay before heavy work
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  await reloadComments();
  try {
    // /api/diff prepends a virtual diff file per commit message in the range,
    // so state.files contains both commit-sentinel "files" (path starts with
    // revue::commit::) and real diff entries. The user can hide commit
    // messages via the settings panel -- when off we drop them client-side
    // (any comments on hidden commits fall through to the "Other comments"
    // orphaned section so they're never silently lost).
    let files = await api(`/api/diff?base=${encodeURIComponent(state.base)}&head=${encodeURIComponent(state.head)}&ignoreWhitespace=${state.ignoreWhitespace}`);
    // The commit-sentinel entries are the range's commit list, so take the shas
    // for the comment filter before the user's display preference can drop them.
    state.rangeCommits = new Set(files.filter(f => isCommitFile(f.file)).map(f => f.file.slice(COMMIT_FILE_PREFIX.length)));
    if (!state.showCommitMessages) files = files.filter(f => !isCommitFile(f.file));
    if (!state.showPrMessage) files = files.filter(f => !isPrFile(f.file));
    state.files = files;
    sortFilesTreeOrder(state.files);
    // The commit filter is scoped to the range that just loaded.
    updateOtherCommitsUI();
  } catch(e) {
    state.files = [];
    document.getElementById('diffview-content').innerHTML = `<div id="diffview-placeholder">Error: ${e.message}</div>`;
    overlay.classList.remove('active');
    return;
  }
  renderFileList();
  await renderAllDiffs();
  renderFileList(); // re-render with accurate badge counts after injection
  overlay.classList.remove('active');
  // If a hash-restored / deeplink-supplied file is set, scroll to it now that
  // the diffs are actually mounted in the DOM. Skip when the file isn't in
  // the current diff (e.g. the user paged commits and the file is no longer
  // present) -- jumpToFile() no-ops in that case.
  if (state.currentFile && state.currentFile !== '__orphaned__') {
    jumpToFile(state.currentFile);
  }
}

// Files representing a commit message are flagged by the server with a sentinel
// path prefix. The colons are illegal in Windows paths so this never collides.
const COMMIT_FILE_PREFIX = 'revue::commit::';
function isCommitFile(file) { return typeof file === 'string' && file.startsWith(COMMIT_FILE_PREFIX); }

// The draft PR description rides the same virtual-file pipeline as commit messages.
const PR_FILE = 'revue::pr::draft';
function isPrFile(file) { return file === PR_FILE; }

// Anything that isn't a real path on disk. Used wherever the distinction is
// "is there a file to fetch more context for / diff against", so the two virtual
// kinds can't drift apart as either grows.
function isVirtualFile(file) { return isCommitFile(file) || isPrFile(file); }

// Sort files in tree order: directories before files at each level, alphabetical within each group
function sortFilesTreeOrder(files) {
  files.sort((a, b) => {
    // Virtual files lead: the PR description first, then commit messages, then
    // real files. Within the commit block preserve server order (newest first).
    const aPr = isPrFile(a.file), bPr = isPrFile(b.file);
    if (aPr && !bPr) return -1;
    if (!aPr && bPr) return 1;
    if (aPr && bPr) return 0;
    const aCommit = isCommitFile(a.file), bCommit = isCommitFile(b.file);
    if (aCommit && !bCommit) return -1;
    if (!aCommit && bCommit) return 1;
    if (aCommit && bCommit) return 0;
    const ap = a.file.split('/'), bp = b.file.split('/');
    const len = Math.min(ap.length, bp.length);
    for (let i = 0; i < len; i++) {
      const aLast = i === ap.length - 1, bLast = i === bp.length - 1;
      if (aLast && !bLast) return 1;
      if (!aLast && bLast) return -1;
      const cmp = ap[i].localeCompare(bp[i]);
      if (cmp !== 0) return cmp;
    }
    return ap.length - bp.length;
  });
}

function commentsForFile(file) {
  const ids = state._globallyInjectableIds;
  return state.comments.filter(c => c.file === file && (state.showResolved || !c.resolved) && commentVisible(c) && (!ids || ids.has(c.id)));
}

function commentCountForFile(file) {
  return commentsForFile(file).length;
}

// Precompute which comment IDs would be injectable across the entire diff
// (not just the current window). Used for file-list badges and the orphaned
// section so out-of-window files still report real comment counts.
function computeGloballyInjectableIds() {
  const ids = new Set();
  if (!state.files.length || !state.comments.length) return ids;
  const filesByName = new Map();
  state.files.forEach(f => filesByName.set(f.file, f));
  const lineMapCache = new Map();
  for (const c of state.comments) {
    const f = filesByName.get(c.file);
    if (!f || !f.patch) continue;
    let maps = lineMapCache.get(c.file);
    if (!maps) {
      const lines = f.patch.split('\n');
      maps = { old: buildLineMap(lines, 'old'), new: buildLineMap(lines, 'new') };
      lineMapCache.set(c.file, maps);
    }
    const lineMap = c.side === 'left' ? maps.old : maps.new;
    const relocated = relocateComment(c, lineMap);
    if (lineMap[relocated.line] !== undefined) ids.add(c.id);
  }
  return ids;
}

// Window helpers. Window slides over state.files for rendering only.
function isWindowed() {
  return state.windowSize > 0 && state.files.length > state.windowSize;
}
function getWindowSlice() {
  if (!isWindowed()) return { start: 0, end: state.files.length };
  const start = Math.max(0, Math.min(state.windowStart, state.files.length - state.windowSize));
  return { start, end: Math.min(state.files.length, start + state.windowSize) };
}

function renderFileList() {
  const el = document.getElementById('filelist-items');
  if (!state.files.length) { el.innerHTML = '<div style="padding:12px;color:var(--text-dim)">No changes</div>'; return; }
  el.innerHTML = '';

  // Partition: the PR description, then commits (a flat "Commits (N)" cluster),
  // then real files (hierarchical tree). All are first-class DiffFile entries in
  // state.files; only the rendering shape differs.
  const prFile = state.files.find(f => isPrFile(f.file));
  const commitFiles = state.files.filter(f => isCommitFile(f.file));
  const regularFiles = state.files.filter(f => !isVirtualFile(f.file));

  if (prFile) {
    const header = document.createElement('div');
    header.className = 'commits-tree-header';
    header.textContent = 'Pull request';
    el.appendChild(header);

    const row = document.createElement('div');
    row.className = 'commit-tree-item' + (state.currentFile === prFile.file ? ' active' : '');
    const title = prFile.pr?.title || '(untitled)';
    const fileComments = commentsForFile(prFile.file);
    const cnt = fileComments.length;
    row.innerHTML = `
      <span class="commit-tree-hash">🔀</span>
      <span class="commit-tree-subject" title="${escHtml(title)}">${escHtml(title)}</span>
      ${prFile.pr?.stale ? '<span class="revue-pr-stale" title="Drafted against a different branch or range">stale</span>' : ''}
      ${cnt ? `<span class="comment-badge">${cnt}</span>` : ''}
    `;
    row.addEventListener('click', () => {
      state.currentFile = prFile.file;
      renderFileList();
      writeHashFromState('replace');
      const target = document.getElementById(`file-${encodeFileId(prFile.file)}`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    el.appendChild(row);
    wireCommentBadge(row, fileComments);
  }

  if (commitFiles.length) {
    const header = document.createElement('div');
    header.className = 'commits-tree-header';
    header.textContent = `Commits (${commitFiles.length})`;
    el.appendChild(header);
    commitFiles.forEach(f => {
      const row = document.createElement('div');
      row.className = 'commit-tree-item' + (state.currentFile === f.file ? ' active' : '');
      const subject = f.commit?.subject || '';
      const hash = f.commit?.hash || '';
      const fileComments = commentsForFile(f.file);
      const cnt = fileComments.length;
      row.innerHTML = `
        <span class="commit-tree-hash">${escHtml(hash.slice(0, 8))}</span>
        <span class="commit-tree-subject" title="${escHtml(subject)}">${escHtml(subject)}</span>
        ${cnt ? `<span class="comment-badge">${cnt}</span>` : ''}
      `;
      row.addEventListener('click', () => {
        state.currentFile = f.file;
        renderFileList();
        writeHashFromState('replace');
        const target = document.getElementById(`file-${encodeFileId(f.file)}`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      el.appendChild(row);
      wireCommentBadge(row, fileComments);
    });
  }

  if (!regularFiles.length) {
    // Still need to render the orphaned section below if any exist
    renderOrphanedTreeEntry(el);
    return;
  }

  // Build tree: { dirs: { name: subtree }, files: [...] }
  const tree = { dirs: {}, files: [] };
  regularFiles.forEach(f => {
    const parts = f.file.split('/');
    let node = tree;
    for (let i = 0; i < parts.length - 1; i++) {
      const dir = parts[i];
      if (!node.dirs[dir]) node.dirs[dir] = { dirs: {}, files: [] };
      node = node.dirs[dir];
    }
    node.files.push(f);
  });

  // Collapse single-child folder chains: "src" -> "components" -> files becomes "src/components" -> files
  function collapse(node) {
    for (const [name, child] of Object.entries(node.dirs)) {
      collapse(child);
      const dirKeys = Object.keys(child.dirs);
      if (child.files.length === 0 && dirKeys.length === 1) {
        const subName = dirKeys[0];
        const merged = name + '/' + subName;
        node.dirs[merged] = child.dirs[subName];
        delete node.dirs[name];
      }
    }
  }
  collapse(tree);

  function renderNode(node, container, depth = 0, parentPath = '') {
    const indent = 10 + depth * 16;
    // Sort: folders first, then files
    const sortedDirs = Object.keys(node.dirs).sort();
    const sortedFiles = [...node.files].sort((a, b) => a.file.localeCompare(b.file));

    sortedDirs.forEach(dirName => {
      const folderPath = parentPath ? `${parentPath}/${dirName}` : dirName;
      const collapseKey = `${state.repo}\n${folderPath}`;
      const collapsed = state.collapsedFolders.has(collapseKey);
      const folderRow = document.createElement('div');
      folderRow.className = 'folder-row' + (collapsed ? ' collapsed' : '');
      folderRow.style.paddingLeft = indent + 'px';
      const childFiles = countFiles(node.dirs[dirName]);
      folderRow.innerHTML = `<span class="folder-arrow">▾</span> ${dirName} <span style="margin-left:auto;font-size:0.625rem;color:var(--text-dim)">${childFiles}</span>`;

      const childContainer = document.createElement('div');
      childContainer.className = 'folder-children' + (collapsed ? ' hidden' : '');

      folderRow.addEventListener('click', () => {
        const isCollapsed = folderRow.classList.toggle('collapsed');
        childContainer.classList.toggle('hidden', isCollapsed);
        if (isCollapsed) state.collapsedFolders.add(collapseKey);
        else state.collapsedFolders.delete(collapseKey);
      });

      container.appendChild(folderRow);
      container.appendChild(childContainer);
      renderNode(node.dirs[dirName], childContainer, depth + 1, folderPath);
    });

    sortedFiles.forEach(f => {
      const fileComments = commentsForFile(f.file);
      const cnt = fileComments.length;
      const div = document.createElement('div');
      const fileName = f.file.split('/').pop();
      div.className = 'file-item' + (f.file === state.currentFile ? ' active' : '');
      div.style.paddingLeft = (indent + 16) + 'px';
      div.innerHTML = `
        <span class="file-name" title="${f.file}">${fileName}</span>
        <span class="file-stats"><span class="stat-add">+${f.additions}</span> <span class="stat-del">-${f.deletions}</span></span>
        ${cnt ? `<span class="comment-badge">${cnt}</span>` : ''}
      `;
      div.addEventListener('click', () => {
        state.currentFile = f.file;
        renderFileList();
        writeHashFromState('replace');
        jumpToFile(f.file);
      });
      container.appendChild(div);
      wireCommentBadge(div, fileComments);
    });
  }

  function countFiles(node) {
    let count = node.files.length;
    for (const child of Object.values(node.dirs)) count += countFiles(child);
    return count;
  }

  // If everything is under one root folder, skip it
  const topDirs = Object.keys(tree.dirs);
  if (tree.files.length === 0 && topDirs.length === 1) {
    renderNode(tree.dirs[topDirs[0]], el, 0, topDirs[0]);
  } else {
    renderNode(tree, el);
  }

  // Show orphaned comment count in file tree as a virtual entry
  renderOrphanedTreeEntry(el);
}

function renderOrphanedTreeEntry(el) {
  const ids = state._globallyInjectableIds;
  const orphanedForTree = state.comments.filter(c => (state.showResolved || !c.resolved) && commentVisible(c) && (!ids || !ids.has(c.id)));
  if (!orphanedForTree.length) return;
  const div = document.createElement('div');
  div.className = 'file-item orphaned-file-item' + (state.currentFile === '__orphaned__' ? ' active' : '');
  div.style.paddingLeft = '26px';
  div.innerHTML = `
    <span class="file-name">Other comments</span>
    <span class="comment-badge">${orphanedForTree.length}</span>
  `;
  div.addEventListener('click', async () => {
    state.currentFile = '__orphaned__';
    writeHashFromState('replace');
    // Ensure the window includes the end so the orphaned section is mounted
    if (isWindowed()) {
      const lastStart = Math.max(0, state.files.length - state.windowSize);
      if (state.windowStart !== lastStart) {
        state.windowStart = lastStart;
        renderFileList();
        await renderAllDiffs({ skipPin: true });
      }
    }
    renderFileList();
    const target = document.getElementById('file-__orphaned__');
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  el.appendChild(div);
  wireCommentBadge(div, orphanedForTree);
}

// ── Jump to comment ────────────────────────────────────────────────────────

// Scroll the diff view to a specific comment and briefly flash it. Mounts the
// comment's file into the render window first if it's outside the current
// slice. Handles both injected comments (rendered inline in a file diff with a
// data-id) and orphaned comments (rendered in the bottom "Other comments"
// section with a data-orphan-id).
async function jumpToComment(commentId) {
  const c = state.comments.find(x => x.id === commentId);
  if (!c) return;
  const injectable = (!state._globallyInjectableIds || state._globallyInjectableIds.has(commentId))
    && state.files.some(f => f.file === c.file);

  if (injectable) {
    state.currentFile = c.file;
    const idx = state.files.findIndex(f => f.file === c.file);
    const { start, end } = getWindowSlice();
    if (idx < start || idx >= end) {
      state.windowStart = idx;
      await renderAllDiffs({ skipPin: true });
    }
  } else {
    // Orphaned comments live in the "Other comments" section pinned to the
    // bottom, which only mounts when the window includes the last file.
    state.currentFile = '__orphaned__';
    if (isWindowed()) {
      const lastStart = Math.max(0, state.files.length - state.windowSize);
      if (state.windowStart !== lastStart) {
        state.windowStart = lastStart;
        await renderAllDiffs({ skipPin: true });
      }
    }
  }
  renderFileList();
  writeHashFromState('replace');

  const sel = injectable
    ? `.revue-comment-item[data-id="${cssEsc(commentId)}"]`
    : `.revue-comment-item[data-orphan-id="${cssEsc(commentId)}"]`;
  const el = document.querySelector(sel);
  if (el) {
    flashComment(el);
  } else {
    // Fall back to the file / section anchor if the comment node isn't present.
    const anchorId = injectable ? `file-${encodeFileId(c.file)}` : 'file-__orphaned__';
    const target = document.getElementById(anchorId);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function flashComment(el) {
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('revue-comment-flash');
  void el.offsetWidth; // restart the animation when re-triggered on the same node
  el.classList.add('revue-comment-flash');
  setTimeout(() => el.classList.remove('revue-comment-flash'), 1600);
}

function cssEsc(s) {
  return (window.CSS && CSS.escape) ? CSS.escape(String(s)) : String(s).replace(/["\\]/g, '\\$&');
}

// Make a file-list comment badge a jump target: a single comment jumps
// straight there; multiple comments open a picker menu.
function wireCommentBadge(rowEl, comments) {
  const badge = rowEl.querySelector('.comment-badge');
  if (!badge || !comments || !comments.length) return;
  badge.classList.add('clickable');
  badge.title = comments.length === 1 ? 'Jump to comment' : `Jump to a comment (${comments.length})`;
  badge.addEventListener('click', (e) => {
    e.stopPropagation();
    if (comments.length === 1) {
      jumpToComment(comments[0].id);
    } else {
      openCommentJumpMenu(badge, comments);
    }
  });
}

let _commentJumpMenu = null;

function closeCommentJumpMenu() {
  if (!_commentJumpMenu) return;
  _commentJumpMenu.remove();
  _commentJumpMenu = null;
  document.removeEventListener('mousedown', _onCommentJumpOutside, true);
  document.removeEventListener('keydown', _onCommentJumpKey, true);
  document.removeEventListener('scroll', closeCommentJumpMenu, true);
  window.removeEventListener('resize', closeCommentJumpMenu);
}

function _onCommentJumpOutside(e) {
  if (_commentJumpMenu && !_commentJumpMenu.contains(e.target)) closeCommentJumpMenu();
}
function _onCommentJumpKey(e) {
  if (e.key === 'Escape') closeCommentJumpMenu();
}

// Open a popover next to a comment badge listing every comment on that file so
// the user can pick which one to jump to. Uses fixed positioning + append to
// <body> so the file-list's overflow doesn't clip it.
function openCommentJumpMenu(anchorEl, comments) {
  closeCommentJumpMenu();
  const menu = document.createElement('div');
  menu.className = 'comment-jump-menu';
  const sorted = [...comments].sort((a, b) => (a.line || 0) - (b.line || 0));
  sorted.forEach(c => {
    const item = document.createElement('div');
    item.className = 'comment-jump-item' + (c.resolved ? ' resolved' : '');
    const author = c.author === 'copilot' ? '🤖' : '👤';
    const body = (c.body || '').replace(/\s+/g, ' ').trim();
    const preview = body.length > 80 ? body.slice(0, 80) + '…' : (body || '(no text)');
    item.innerHTML = `
      <span class="comment-jump-line">L${c.line}</span>
      <span class="comment-jump-author">${author}</span>
      <span class="comment-jump-preview">${escHtml(preview)}</span>`;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      closeCommentJumpMenu();
      jumpToComment(c.id);
    });
    menu.appendChild(item);
  });
  document.body.appendChild(menu);
  _commentJumpMenu = menu;
  positionCommentJumpMenu(menu, anchorEl);
  // Defer wiring the dismiss listeners so the opening click doesn't close it.
  setTimeout(() => {
    if (!_commentJumpMenu) return;
    document.addEventListener('mousedown', _onCommentJumpOutside, true);
    document.addEventListener('keydown', _onCommentJumpKey, true);
    document.addEventListener('scroll', closeCommentJumpMenu, true);
    window.addEventListener('resize', closeCommentJumpMenu);
  }, 0);
}

function positionCommentJumpMenu(menu, anchorEl) {
  const r = anchorEl.getBoundingClientRect();
  menu.style.visibility = 'hidden';
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  let left = r.left;
  let top = r.bottom + 4;
  if (left + mw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - 8 - mw);
  if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - 4 - mh);
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  menu.style.visibility = 'visible';
}

// ── Diff rendering ─────────────────────────────────────────────────────────

// Save a reference to the first file wrapper whose bottom edge is inside the
// viewport, plus its offset from the viewport top. Returned object can be
// passed to restoreScrollPin to keep the visual position stable across a
// re-render that adds or removes file wrappers above the viewport.
function captureScrollPin() {
  const scrollEl = document.getElementById('diffview');
  if (!scrollEl) return null;
  const containerRect = scrollEl.getBoundingClientRect();
  const wrappers = scrollEl.querySelectorAll('.d2h-file-wrapper');
  for (const w of wrappers) {
    const rect = w.getBoundingClientRect();
    if (rect.bottom >= containerRect.top) {
      return { id: w.id, offset: rect.top - containerRect.top, fallbackScrollTop: scrollEl.scrollTop };
    }
  }
  return { id: null, offset: 0, fallbackScrollTop: scrollEl.scrollTop };
}

function restoreScrollPin(pin) {
  const scrollEl = document.getElementById('diffview');
  if (!scrollEl || !pin) return;
  if (pin.id) {
    const el = document.getElementById(pin.id);
    if (el) {
      const containerRect = scrollEl.getBoundingClientRect();
      const currentOffset = el.getBoundingClientRect().top - containerRect.top;
      scrollEl.scrollTop += currentOffset - pin.offset;
      return;
    }
  }
  scrollEl.scrollTop = pin.fallbackScrollTop;
}

// Make `file` visible in the diff view. If it's outside the current render
// window, slide the window so the file becomes the first rendered file, then
// scroll to it.
async function jumpToFile(file) {
  const idx = state.files.findIndex(f => f.file === file);
  if (idx < 0) return;
  const { start, end } = getWindowSlice();
  if (idx < start || idx >= end) {
    state.windowStart = idx;
    renderFileList();
    await renderAllDiffs({ skipPin: true });
  }
  const target = document.getElementById(`file-${encodeFileId(file)}`);
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function renderAllDiffs(opts) {
  // A full re-render always reflects the current comment set, so anything the
  // live-comment path was holding back is satisfied by getting here.
  state.commentsDirty = false;
  const skipPin = opts && opts.skipPin;
  const scrollEl = document.getElementById('diffview');
  const pin = skipPin ? null : captureScrollPin();
  const fallbackScrollTop = scrollEl?.scrollTop ?? 0;

  // Save any open comment input boxes before re-rendering
  const openInputs = [];
  document.querySelectorAll('.revue-input-row').forEach(row => {
    const wrap = row.querySelector('.revue-comment-input-wrap');
    if (!wrap) return;
    const textarea = wrap.querySelector('textarea');
    const text = textarea?.value || '';
    // Extract file/line/side from the data attributes we'll store
    if (row.dataset.file) {
      openInputs.push({ file: row.dataset.file, line: parseInt(row.dataset.line), side: row.dataset.side, lineContent: row.dataset.lineContent || '', text });
    }
  });

  state._globallyInjectableIds = computeGloballyInjectableIds();

  const dv = document.getElementById('diffview-content');
  if (!state.files.length) {
    dv.innerHTML = '<div id="diffview-placeholder">No changes</div>';
    return;
  }

  const { start, end } = getWindowSlice();
  const windowed = isWindowed();
  const windowFiles = state.files.slice(start, end);

  dv.innerHTML = '<div id="d2h-target"></div>';
  const target = document.getElementById('d2h-target');
  const isSxS = state.diffLayout === 'side-by-side';

  // Top control row -- previous files (only when windowed and not at start)
  if (windowed && start > 0) {
    target.appendChild(makeWindowControl('top', start, state.files.length - end));
  }

  // Inner container that holds the actual diffs (separate from controls so
  // wrapper indexing matches the windowed slice exactly).
  const diffsHost = document.createElement('div');
  target.appendChild(diffsHost);

  if (isSxS) {
    // Per-file rendering: use inline for pure adds/deletes, SxS for modifications.
    // Commit messages are synthesised as add-only diffs so they naturally take
    // the inline path -- there's no "before" side to compare against.
    for (const f of windowFiles) {
      if (!f.patch) continue;
      const isAddOnly = f.deletions === 0;
      const isDeleteOnly = f.additions === 0;
      const format = (isAddOnly || isDeleteOnly) ? 'line-by-line' : 'side-by-side';
      const fileTarget = document.createElement('div');
      diffsHost.appendChild(fileTarget);
      const ui = new Diff2HtmlUI(fileTarget, f.patch, {
        drawFileList: false,
        matching: 'lines',
        outputFormat: format,
        renderNothingWhenEmpty: false,
        highlight: true,
        colorScheme: document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark',
      });
      await ui.draw();
    }
  } else {
    // Inline: render windowed files together
    const fullDiff = windowFiles.map(f => f.patch).filter(Boolean).join('\n');
    const ui = new Diff2HtmlUI(diffsHost, fullDiff, {
      drawFileList: false,
      matching: 'lines',
      outputFormat: 'line-by-line',
      renderNothingWhenEmpty: false,
      highlight: true,
      colorScheme: document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark',
    });
    await ui.draw();
  }

  const injectedIds = new Set();

  // Add anchor IDs to each file wrapper and attach per-file handlers.
  // Wrapper indices map 1:1 onto windowFiles, not state.files. Commit-message
  // wrappers go through the same path -- they're just DiffFile entries whose
  // path starts with the commit sentinel; decoration / native-Viewed wiring
  // handle the cosmetic differences after diff2html has done its work.
  const fileWrappers = diffsHost.querySelectorAll('.d2h-file-wrapper');
  windowFiles.forEach((f, i) => {
    if (i >= fileWrappers.length) return;
    const wrapper = fileWrappers[i];
    wrapper.id = `file-${encodeFileId(f.file)}`;
    const commit = isCommitFile(f.file);
    const pr = isPrFile(f.file);
    // Both virtual kinds share the message-style presentation; only the header
    // decoration differs.
    if (commit || pr) wrapper.classList.add('revue-commit');
    if (pr) wrapper.classList.add('revue-pr');
    if (state.wrappedFiles.has(f.file)) wrapper.classList.add('revue-wrap');
    if (commit && f.commit) decorateCommitHeader(f.commit, wrapper);
    if (pr) decoratePrHeader(f.pr, wrapper);
    injectWrapToggle(f.file, wrapper);
    wireViewedCheckbox(f.file, wrapper);
    const injected = injectComments(f.file, f.patch, wrapper);
    injected.forEach(id => injectedIds.add(id));
    attachLineClickHandlers(f.file, f.patch, wrapper);
    // Virtual files are a complete, fixed text -- there's no "more context"
    // to fetch, so the expand-context controls would be dead weight.
    if (!commit && !pr) attachExpandButtons(f.file, wrapper);
  });
  state._injectedIds = injectedIds;

  // Orphaned set is computed against the global injectable set so files that
  // are merely out-of-window aren't flagged as orphaned.
  const globalIds = state._globallyInjectableIds;
  const visibleComments = state.comments.filter(c => (state.showResolved || !c.resolved) && commentVisible(c));
  const orphaned = visibleComments.filter(c => !globalIds.has(c.id));

  // The orphaned section only mounts when the window includes the end of the
  // file list (so it stays at the very bottom of the diff view rather than
  // jumping around as the user slides).
  const atEnd = end === state.files.length;
  if (orphaned.length && atEnd) {
    const section = document.createElement('div');
    section.className = 'd2h-file-wrapper orphaned-wrapper';
    section.id = 'file-__orphaned__';

    // Group by file
    const byFile = {};
    orphaned.forEach(c => {
      if (!byFile[c.file]) byFile[c.file] = [];
      byFile[c.file].push(c);
    });

    section.innerHTML = `<div class="d2h-file-header" style="position:sticky;top:0;z-index:20">
      <span style="font-weight:600">Other comments</span>
      <span style="margin-left:8px;color:var(--text-dim);font-size:0.75rem">${orphaned.length} comment${orphaned.length > 1 ? 's' : ''} not visible in the diff</span>
      <button class="delete-resolved-btn" id="delete-all-orphaned" style="margin-left:auto;font-size:0.75rem">Delete all</button>
    </div><div class="orphaned-comments-list"></div>`;

    const commentsList = section.querySelector('.orphaned-comments-list');
    for (const [file, comments] of Object.entries(byFile).sort((a, b) => a[0].localeCompare(b[0]))) {
      const group = document.createElement('div');
      group.className = 'orphaned-file-group';
      const header = document.createElement('div');
      header.className = 'orphaned-file-header';
      header.textContent = isPrFile(file)
        ? 'Pull request description (not shown)'
        : isCommitFile(file)
          ? `Commit ${file.slice('revue::commit::'.length, 'revue::commit::'.length + 8)} (not in current range)`
          : file;
      group.appendChild(header);
      comments.forEach(c => {
        renderCommentItem(group, c, file, { orphaned: true });
      });
      commentsList.appendChild(group);
    }

    section.querySelector('#delete-all-orphaned').addEventListener('click', async () => {
      if (!confirm(`Delete ${orphaned.length} orphaned comment${orphaned.length > 1 ? 's' : ''}?`)) return;
      await apiPost('/api/comments/delete-batch', orphaned.map(c => c.id));
      await reloadComments();
      renderFileList();
      await renderAllDiffs();
    });

    target.appendChild(section);
  }

  // Bottom control row -- next files (only when windowed and not at end)
  if (windowed && !atEnd) {
    target.appendChild(makeWindowControl('bottom', start, state.files.length - end));
  }

  // Restore any open comment input boxes
  openInputs.forEach(inp => {
    // Find the matching line number cell in the re-rendered DOM
    const wrapper = document.getElementById(`file-${encodeFileId(inp.file)}`);
    if (!wrapper) return;
    const isSxS = !!wrapper.querySelector('.d2h-file-side-diff');
    const selector = isSxS ? 'td.d2h-code-side-linenumber' : 'td.d2h-code-linenumber';
    const cells = wrapper.querySelectorAll(selector);
    for (const cell of cells) {
      const side = isSxS ? detectSide(cell) : (cell.querySelector('.line-num2') ? 'right' : 'left');
      if (side !== inp.side) continue;
      let lineNum;
      if (isSxS) {
        lineNum = parseInt(cell.textContent.trim(), 10);
      } else {
        const numEl = inp.side === 'left' ? cell.querySelector('.line-num1') : cell.querySelector('.line-num2');
        lineNum = numEl ? parseInt(numEl.textContent.trim(), 10) : NaN;
      }
      if (lineNum === inp.line) {
        const tr = cell.closest('tr');
        if (tr && !tr.nextSibling?.classList?.contains('revue-input-row')) {
          showCommentInput(tr, inp.file, inp.line, inp.lineContent, inp.side, inp.text);
        }
        break;
      }
    }
  });

  if (skipPin) {
    if (scrollEl) scrollEl.scrollTop = fallbackScrollTop;
  } else {
    restoreScrollPin(pin);
  }
}

function makeWindowControl(position, start, remainingAfter) {
  const row = document.createElement('div');
  row.className = 'window-control';
  const isTop = position === 'top';
  const count = isTop ? start : remainingAfter;
  const label = isTop ? 'previous' : 'next';
  row.innerHTML = `
    <button class="window-btn-one">Load ${isTop ? 'previous' : 'more'}</button>
    <span class="window-count">(${count} ${label})</span>
    <button class="window-btn-jump">Jump to ${isTop ? 'top' : 'end'}</button>
  `;
  row.querySelector('.window-btn-one').addEventListener('click', async () => {
    if (isTop) {
      state.windowStart = Math.max(0, state.windowStart - 1);
    } else {
      state.windowStart = Math.min(state.files.length - state.windowSize, state.windowStart + 1);
    }
    renderFileList();
    await renderAllDiffs();
  });
  row.querySelector('.window-btn-jump').addEventListener('click', async () => {
    state.windowStart = isTop ? 0 : Math.max(0, state.files.length - state.windowSize);
    renderFileList();
    await renderAllDiffs({ skipPin: true });
  });
  return row;
}

// ── Comment relocation ────────────────────────────────────────────────────

function relocateComment(comment, lineMap) {
  const stored = comment.lineContent?.trim();
  if (!stored) return { line: comment.line, drifted: false };

  // Fast path: content still matches at stored line
  if (lineMap[comment.line] !== undefined && lineMap[comment.line].trim() === stored)
    return { line: comment.line, drifted: false };

  // Search outward from original line
  const maxDrift = 200;
  for (let delta = 1; delta <= maxDrift; delta++) {
    const above = comment.line - delta;
    const below = comment.line + delta;
    if (above > 0 && lineMap[above] !== undefined && lineMap[above].trim() === stored)
      return { line: above, drifted: true };
    if (lineMap[below] !== undefined && lineMap[below].trim() === stored)
      return { line: below, drifted: true };
  }

  // Content not found — return original line, will show as orphaned if line doesn't exist in diff
  return { line: comment.line, drifted: false };
}

// ── Comment injection ──────────────────────────────────────────────────────

function injectComments(file, patch, container) {
  const injectedIds = [];
  const lines = patch.split('\n');
  const newLineMap = buildLineMap(lines, 'new');
  const oldLineMap = buildLineMap(lines, 'old');

  const lineComments = {};
  state.comments
    .filter(c => c.file === file)
    .filter(c => state.showResolved || !c.resolved)
    .filter(c => branchVisible(c) && commitVisible(c))
    .forEach(c => {
      const lineMap = c.side === 'left' ? oldLineMap : newLineMap;
      const relocated = relocateComment(c, lineMap);
      const displayLine = relocated.line;
      const key = `${c.side}:${displayLine}`;
      if (!lineComments[key]) lineComments[key] = [];
      lineComments[key].push({ ...c, _displayLine: displayLine, _drifted: relocated.drifted });
    });

  if (!Object.keys(lineComments).length) return injectedIds;

  // Find all line number cells and inject threads after their <tr>
  const isSideBySide = !!container.querySelector('.d2h-file-side-diff');
  if (isSideBySide) {
    const panels = container.querySelectorAll('.d2h-file-side-diff');
    const leftTbody = panels[0].querySelector('tbody');
    const rightTbody = panels[1].querySelector('tbody');
    const leftRows = Array.from(leftTbody.querySelectorAll(':scope > tr'));
    const rightRows = Array.from(rightTbody.querySelectorAll(':scope > tr'));

    // Process both sides, collecting insertions to apply in reverse order
    const insertions = [];
    for (let i = 0; i < leftRows.length; i++) {
      for (const [rows, side] of [[leftRows, 'left'], [rightRows, 'right']]) {
        const tr = rows[i];
        const cell = tr.querySelector('td.d2h-code-side-linenumber');
        if (!cell) continue;
        const lineNum = parseInt(cell.textContent.trim(), 10);
        if (isNaN(lineNum)) continue;
        const key = `${side}:${lineNum}`;
        const comments = lineComments[key];
        if (comments && !cell.dataset.injected) {
          cell.dataset.injected = '1';
          insertions.push({ index: i, side, comments });
        }
      }
    }

    // Apply insertions in reverse so indices stay valid
    insertions.sort((a, b) => b.index - a.index);
    for (const ins of insertions) {
      const leftTr = leftTbody.querySelectorAll(':scope > tr')[ins.index];
      const rightTr = rightTbody.querySelectorAll(':scope > tr')[ins.index];
      const commentRow = document.createElement('tr');
      commentRow.className = 'revue-comment-row';
      const colCount = leftTr.cells.length || 2;
      commentRow.innerHTML = `<td colspan="${colCount}"><div class="revue-comment-thread"></div></td>`;

      const spacerRow = document.createElement('tr');
      spacerRow.className = 'revue-comment-row revue-spacer-row';
      spacerRow.innerHTML = `<td colspan="${colCount}"></td>`;

      if (ins.side === 'left') {
        leftTr.after(commentRow);
        rightTr.after(spacerRow);
      } else {
        rightTr.after(commentRow);
        leftTr.after(spacerRow);
      }

      const threadDiv = commentRow.querySelector('.revue-comment-thread');
      ins.comments.forEach(c => { injectedIds.push(c.id); renderCommentItem(threadDiv, c, file); });

      // Sync spacer height with comment row
      const syncHeight = () => { spacerRow.style.height = commentRow.offsetHeight + 'px'; };
      syncHeight();
      const ro = new ResizeObserver(syncHeight);
      ro.observe(commentRow);
    }
  } else {
    const rows = container.querySelectorAll('tr');
    rows.forEach(tr => {
      // Inline/unified: single cell with .line-num1 (old) and .line-num2 (new)
      const cell = tr.querySelector('td.d2h-code-linenumber');
      if (!cell || cell.dataset.injected) return;
      const num1El = cell.querySelector('.line-num1');
      const num2El = cell.querySelector('.line-num2');
      const oldNum = num1El ? parseInt(num1El.textContent.trim(), 10) : NaN;
      const newNum = num2El ? parseInt(num2El.textContent.trim(), 10) : NaN;
      const matched = [];
      if (!isNaN(newNum) && lineComments[`right:${newNum}`]) matched.push(...lineComments[`right:${newNum}`]);
      if (!isNaN(oldNum) && lineComments[`left:${oldNum}`]) matched.push(...lineComments[`left:${oldNum}`]);
      if (matched.length) {
        cell.dataset.injected = '1';
        const threadRow = document.createElement('tr');
        threadRow.className = 'revue-comment-row';
        const colCount = tr.cells.length || 4;
        threadRow.innerHTML = `<td colspan="${colCount}"><div class="revue-comment-thread"></div></td>`;
        tr.after(threadRow);
        const threadDiv = threadRow.querySelector('.revue-comment-thread');
        matched.forEach(c => { injectedIds.push(c.id); renderCommentItem(threadDiv, c, file); });
      }
    });
  }
  return injectedIds;
}

function renderCommentItem(container, c, file, { orphaned = false } = {}) {
  const div = document.createElement('div');
  div.className = 'revue-comment-item' + (c.resolved ? ' resolved' : '');
  if (orphaned) {
    div.dataset.orphanId = c.id;
    div.style.margin = '4px 12px';
  } else {
    div.dataset.id = c.id;
  }

  const authorLabel = c.author === 'copilot' ? '🤖 Copilot' : `👤 ${c.author || 'user'}`;
  const driftLabel = c._drifted ? ` <span style="color:var(--text-dim);font-style:italic" title="Content moved from original line ${c.line}">↕ moved from line ${c.line}</span>` : '';
  // Show a branch badge whenever a comment was made on a branch other than the one we're on now —
  // that way "show all branches" mode (and any rare case where stale comments sneak through) is obvious.
  const showBadge = c.branch && c.branch !== state.currentBranch;
  const branchBadge = showBadge ? ` <span class="revue-branch-badge" title="Created on branch ${escHtml(c.branch)}">${escHtml(c.branch)}</span>` : '';
  // Likewise for the commit: a comment showing through the "all commits" filter
  // was written against code that isn't on screen, so say which commit it was.
  const commitBadge = commitInView(c) ? '' : (c.commit === WORKING_TREE_COMMIT
    ? ` <span class="revue-branch-badge" title="Written against uncommitted changes">working tree</span>`
    : ` <span class="revue-branch-badge" title="Written against commit ${escHtml(c.commit)}">${escHtml(c.commit.slice(0, 8))}</span>`);
  div.innerHTML = `
    <div class="revue-comment-author">${escHtml(authorLabel)}${branchBadge}${commitBadge}</div>
    <div class="revue-comment-body">${escHtml(c.body)}</div>
    <div class="revue-comment-meta">
      <span>Line ${c._displayLine || c.line}${driftLabel}</span>
      <span>${new Date(c.created).toLocaleString()}</span>
      <button class="reply-btn">Reply</button>
      <button class="edit-btn">Edit</button>
      <button class="resolve-btn">${c.resolved ? 'Unresolve' : 'Resolve'}</button>
      <button class="delete-btn">Delete</button>
    </div>
    <div class="revue-replies"></div>
  `;

  // Render existing replies
  const repliesDiv = div.querySelector('.revue-replies');
  if (c.replies?.length) {
    c.replies.forEach(r => {
      const rAuthor = r.author === 'copilot' ? '🤖 Copilot' : `👤 ${r.author || 'user'}`;
      const replyEl = document.createElement('div');
      replyEl.className = 'revue-reply';
      replyEl.innerHTML = `
        <div class="revue-comment-author">${escHtml(rAuthor)}</div>
        <div class="revue-comment-body">${escHtml(r.body)}</div>
        <div class="revue-comment-meta"><span>${new Date(r.created).toLocaleString()}</span></div>
      `;
      repliesDiv.appendChild(replyEl);
    });
  }

  div.querySelector('.edit-btn').addEventListener('click', () => {
    if (div.querySelector('.revue-comment-edit')) return;
    const bodyDiv = div.querySelector('.revue-comment-body');
    const editDiv = document.createElement('div');
    editDiv.className = 'revue-comment-edit';
    editDiv.innerHTML = `
      <textarea rows="3"></textarea>
      <div class="revue-comment-btn-row">
        <button class="revue-btn secondary cancel-edit-btn">Cancel</button>
        <button class="revue-btn save-edit-btn">Save</button>
      </div>
    `;
    const textarea = editDiv.querySelector('textarea');
    textarea.value = c.body;
    bodyDiv.hidden = true;
    bodyDiv.after(editDiv);
    textarea.focus();
    textarea.select();

    editDiv.querySelector('.cancel-edit-btn').addEventListener('click', () => {
      editDiv.remove();
      bodyDiv.hidden = false;
      flushLiveComments();
    });
    editDiv.querySelector('.save-edit-btn').addEventListener('click', async () => {
      const body = textarea.value.trim();
      if (!body) return;
      await apiPost('/api/comments', {...c, body});
      await reloadComments();
      renderFileList();
      await renderAllDiffs();
    });
  });

  div.querySelector('.reply-btn').addEventListener('click', () => {
    // Don't add if already has an open reply input
    if (div.querySelector('.revue-reply-input')) return;
    const inputDiv = document.createElement('div');
    inputDiv.className = 'revue-reply-input';
    inputDiv.innerHTML = `
      <textarea placeholder="Write a reply…" rows="2"></textarea>
      <div class="revue-comment-btn-row">
        <button class="revue-btn secondary cancel-reply-btn">Cancel</button>
        <button class="revue-btn save-reply-btn">Reply</button>
      </div>
    `;
    repliesDiv.appendChild(inputDiv);
    inputDiv.querySelector('textarea').focus();
    inputDiv.querySelector('.cancel-reply-btn').addEventListener('click', () => { inputDiv.remove(); flushLiveComments(); });
    inputDiv.querySelector('.save-reply-btn').addEventListener('click', async () => {
      const body = inputDiv.querySelector('textarea').value.trim();
      if (!body) return;
      await apiPost(`/api/comments/${c.id}/replies`, { author: 'user', body });
      await reloadComments();
      renderFileList();
      await renderAllDiffs();
    });
  });
  div.querySelector('.resolve-btn').addEventListener('click', async () => {
    await apiPost('/api/comments', {...c, resolved: !c.resolved});
    await reloadComments();
    renderFileList();
    await renderAllDiffs();
  });
  div.querySelector('.delete-btn').addEventListener('click', async () => {
    await apiDelete(`/api/comments/${c.id}`);
    await reloadComments();
    renderFileList();
    await renderAllDiffs();
  });
  container.appendChild(div);
}

// ── Per-file word-wrap toggle ──────────────────────────────────────────────

function injectWrapToggle(file, wrapper) {
  const header = wrapper.querySelector('.d2h-file-header');
  if (!header || header.querySelector('.revue-wrap-toggle')) return;
  const label = document.createElement('label');
  label.className = 'revue-wrap-toggle';
  label.title = 'Wrap long lines in this file';
  const checked = state.wrappedFiles.has(file) ? 'checked' : '';
  label.innerHTML = `<input type="checkbox" ${checked}><span>wrap</span>`;
  const input = label.querySelector('input');
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('change', () => {
    if (input.checked) {
      state.wrappedFiles.add(file);
      wrapper.classList.add('revue-wrap');
      syncSxsRowHeights(wrapper);
      observeSxsForResize(wrapper);
    } else {
      state.wrappedFiles.delete(file);
      wrapper.classList.remove('revue-wrap');
      clearSxsRowHeights(wrapper);
      unobserveSxsForResize(wrapper);
    }
    saveWrappedFiles();
  });
  header.appendChild(label);
  // If wrap is already applied at render time, sync heights once layout is ready.
  if (wrapper.classList.contains('revue-wrap')) {
    requestAnimationFrame(() => {
      syncSxsRowHeights(wrapper);
      observeSxsForResize(wrapper);
    });
  }
}

// ── Per-file viewed (collapse) toggle ───────────────────────────────────────

// Wires the diff2html-native Viewed checkbox into our persistence + collapse
// behaviour. The label/input is part of the markup diff2html emits inside
// every `.d2h-file-header`; we restore the checked state from
// `state.viewedFiles`, then on change toggle `.revue-viewed` on the wrapper
// (which the CSS uses to hide the body + dim the header) and save the cookie.
//
// We deliberately re-mount the input (clone-and-replace) before attaching so
// any click handler diff2html attached via `fileContentToggle()` is dropped --
// otherwise the user would see the body collapse/uncollapse twice per click.
function wireViewedCheckbox(file, wrapper) {
  const input = wrapper.querySelector('.d2h-file-collapse-input');
  if (!input) return;
  const fresh = input.cloneNode(true);
  input.replaceWith(fresh);
  fresh.checked = state.viewedFiles.has(file);
  if (fresh.checked) wrapper.classList.add('revue-viewed');
  fresh.addEventListener('change', () => {
    if (fresh.checked) {
      state.viewedFiles.add(file);
      wrapper.classList.add('revue-viewed');
    } else {
      state.viewedFiles.delete(file);
      wrapper.classList.remove('revue-viewed');
    }
    saveViewedFiles();
  });
}

// Rewrites the diff2html-generated header of a commit-message wrapper to show
// `<icon> <short-sha>  <subject>` instead of the raw sentinel file path, and
// inserts an author/date span between the subject and the right-aligned
// controls (Viewed checkbox + wrap toggle). CSS handles the rest (hiding the
// +N -0 stats, the new-file tag, the + line prefix, the hunk info row, and
// bolding the subject line).
function decorateCommitHeader(meta, wrapper) {
  const header = wrapper.querySelector('.d2h-file-header');
  if (!header || header.dataset.revueCommitDecorated) return;
  header.dataset.revueCommitDecorated = '1';
  const nameEl = header.querySelector('.d2h-file-name');
  if (nameEl) {
    nameEl.innerHTML = `
      <span class="revue-commit-icon" title="Commit message">📝</span>
      <span class="revue-commit-hash" title="${escHtml(meta.hash)}">${escHtml(meta.hash.slice(0, 8))}</span>
      <span class="revue-commit-subject" title="${escHtml(meta.subject || '')}">${escHtml(meta.subject || '')}</span>
    `;
  }
  let dateText = meta.date;
  try { dateText = new Date(meta.date).toLocaleString(); } catch {}
  const metaEl = document.createElement('span');
  metaEl.className = 'revue-commit-meta';
  metaEl.textContent = `${meta.author || ''} · ${dateText}`;
  // Place author/date BEFORE the Viewed checkbox so the metadata sits next to
  // the subject and the user actions (Viewed, wrap) cluster on the far right.
  const collapse = header.querySelector('.d2h-file-collapse');
  const wrap = header.querySelector('.revue-wrap-toggle');
  if (collapse) header.insertBefore(metaEl, collapse);
  else if (wrap) header.insertBefore(metaEl, wrap);
  else header.appendChild(metaEl);
}

// Same treatment for the draft PR description: title in place of the sentinel
// path, and when it was drafted (or a stale badge when it was written against a
// different branch or range).
function decoratePrHeader(meta, wrapper) {
  const header = wrapper.querySelector('.d2h-file-header');
  if (!header || header.dataset.revueCommitDecorated) return;
  header.dataset.revueCommitDecorated = '1';
  const title = (meta && meta.title) || '(untitled)';
  const nameEl = header.querySelector('.d2h-file-name');
  if (nameEl) {
    nameEl.innerHTML = `
      <span class="revue-commit-icon" title="Pull request description">🔀</span>
      <span class="revue-commit-subject" title="${escHtml(title)}">${escHtml(title)}</span>
      ${meta && meta.stale ? '<span class="revue-pr-stale" title="Drafted against a different branch or range">stale</span>' : ''}
    `;
  }

  const metaEl = document.createElement('span');
  metaEl.className = 'revue-commit-meta';
  if (meta && meta.generated) {
    let when = meta.generated;
    try { when = new Date(meta.generated).toLocaleString(); } catch {}
    metaEl.textContent = `drafted ${when}${meta.generatedBy ? ` by ${meta.generatedBy}` : ''}`;
  } else {
    metaEl.textContent = 'draft';
  }
  const collapse = header.querySelector('.d2h-file-collapse');
  const wrap = header.querySelector('.revue-wrap-toggle');
  if (collapse) header.insertBefore(metaEl, collapse);
  else if (wrap) header.insertBefore(metaEl, wrap);
  else header.appendChild(metaEl);
}

// In SxS mode each side is its own table, so wrapped lines on one side won't
// push the corresponding row on the other side taller. Sync heights manually.
function getSxsTables(wrapper) {
  const tables = wrapper.querySelectorAll('.d2h-file-side-diff > .d2h-code-wrapper > .d2h-diff-table, .d2h-file-side-diff .d2h-diff-table');
  return tables.length === 2 ? [tables[0], tables[1]] : null;
}

function clearSxsRowHeights(wrapper) {
  wrapper.querySelectorAll('tr[data-revue-synced]').forEach(tr => {
    tr.style.height = '';
    tr.removeAttribute('data-revue-synced');
  });
}

function syncSxsRowHeights(wrapper) {
  const tables = getSxsTables(wrapper);
  if (!tables) return;
  const left = tables[0].querySelectorAll(':scope > tbody > tr, :scope > tr');
  const right = tables[1].querySelectorAll(':scope > tbody > tr, :scope > tr');
  const n = Math.min(left.length, right.length);
  // Reset first so we measure natural (fractional) heights.
  for (let i = 0; i < n; i++) { left[i].style.height = ''; right[i].style.height = ''; }
  // Measure with getBoundingClientRect for fractional precision, then round up
  // so the result is consistent between both sides (offsetHeight truncates
  // and accumulates drift over hundreds of rows).
  const heights = new Array(n);
  for (let i = 0; i < n; i++) {
    const lh = left[i].getBoundingClientRect().height;
    const rh = right[i].getBoundingClientRect().height;
    heights[i] = Math.ceil(Math.max(lh, rh));
  }
  for (let i = 0; i < n; i++) {
    const h = heights[i] + 'px';
    left[i].style.height = h;
    right[i].style.height = h;
    left[i].setAttribute('data-revue-synced', '1');
    right[i].setAttribute('data-revue-synced', '1');
  }
}

const _sxsObservers = new WeakMap();
function observeSxsForResize(wrapper) {
  if (_sxsObservers.has(wrapper)) return;
  let scheduled = false;
  const ro = new ResizeObserver(() => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      if (wrapper.classList.contains('revue-wrap')) syncSxsRowHeights(wrapper);
    });
  });
  ro.observe(wrapper);
  _sxsObservers.set(wrapper, ro);
}
function unobserveSxsForResize(wrapper) {
  const ro = _sxsObservers.get(wrapper);
  if (ro) { ro.disconnect(); _sxsObservers.delete(wrapper); }
}

// ── Line click → comment box ───────────────────────────────────────────────

function attachLineClickHandlers(file, patch, container) {
  const lines = patch.split('\n');
  const newLineMap = buildLineMap(lines, 'new');
  const oldLineMap = buildLineMap(lines, 'old');
  const isSideBySide = !!container.querySelector('.d2h-file-side-diff');

  container.querySelectorAll('td.d2h-code-side-linenumber, td.d2h-code-linenumber').forEach(cell => {
    if (isSideBySide) {
      cell.addEventListener('click', () => {
        const lineNum = parseInt(cell.textContent.trim(), 10);
        if (isNaN(lineNum)) return;
        const tr = cell.closest('tr');
        if (!tr) return;
        if (tr.nextSibling?.classList?.contains('revue-input-row')) return;
        const side = detectSide(cell);
        const lineContent = (side === 'left' ? oldLineMap[lineNum] : newLineMap[lineNum]) || '';
        showCommentInput(tr, file, lineNum, lineContent, side);
      });
    } else {
      // Inline: attach click to individual .line-num1 / .line-num2 divs
      const num1 = cell.querySelector('.line-num1');
      const num2 = cell.querySelector('.line-num2');
      const handler = (numEl, side) => {
        if (!numEl) return;
        numEl.style.cursor = 'pointer';
        numEl.addEventListener('click', (e) => {
          e.stopPropagation();
          const lineNum = parseInt(numEl.textContent.trim(), 10);
          if (isNaN(lineNum)) return;
          const tr = cell.closest('tr');
          if (!tr) return;
          if (tr.nextSibling?.classList?.contains('revue-input-row')) return;
          const lineContent = (side === 'left' ? oldLineMap[lineNum] : newLineMap[lineNum]) || '';
          showCommentInput(tr, file, lineNum, lineContent, side);
        });
      };
      handler(num1, 'left');
      handler(num2, 'right');
    }
  });
}

function attachExpandButtons(file, container) {
  const isSxS = !!container.querySelector('.d2h-file-side-diff');

  const expandHandler = async (e) => {
    e.stopPropagation();
    const currentContext = state.fileContext[file] || 5;
    const newContext = currentContext + 5;
    state.fileContext[file] = newContext;
    const updated = await api(`/api/file-diff?base=${encodeURIComponent(state.base)}&head=${encodeURIComponent(state.head)}&file=${encodeURIComponent(file)}&ignoreWhitespace=${state.ignoreWhitespace}&context=${newContext}`);
    if (!updated) return;
    const idx = state.files.findIndex(f => f.file === file);
    if (idx >= 0) state.files[idx] = updated;
    renderFileList();
    await renderAllDiffs();
    const target = document.getElementById(`file-${encodeFileId(file)}`);
    if (target) target.scrollIntoView({ block: 'start' });
  };

  const makeBtn = (arrow) => {
    const btn = document.createElement('button');
    btn.className = 'revue-expand-btn';
    btn.textContent = arrow;
    btn.title = 'Show more context';
    btn.addEventListener('click', expandHandler);
    return btn;
  };

  const setupExpandCell = (cell, arrow) => {
    cell.appendChild(makeBtn(arrow));
    cell.title = 'Show more context';
    cell.addEventListener('click', expandHandler);
  };

  // Add expand arrows on @@ hunk header line number cells
  if (isSxS) {
    const panels = container.querySelectorAll('.d2h-file-side-diff');
    const leftInfoCells = panels[0].querySelectorAll('td.d2h-code-side-linenumber.d2h-info');
    const rightInfoCells = panels[1].querySelectorAll('td.d2h-code-side-linenumber.d2h-info');
    const leftCodeCells = panels[0].querySelectorAll('td.d2h-info:not(.d2h-code-side-linenumber)');
    const rightCodeCells = panels[1].querySelectorAll('td.d2h-info:not(.d2h-code-side-linenumber)');
    leftInfoCells.forEach((numCell, i) => {
      setupExpandCell(numCell, i === 0 ? '↑' : '↕');
      // Mirror arrow and hunk text to right panel
      if (rightInfoCells[i]) setupExpandCell(rightInfoCells[i], i === 0 ? '↑' : '↕');
      if (leftCodeCells[i] && rightCodeCells[i]) {
        rightCodeCells[i].innerHTML = leftCodeCells[i].innerHTML;
      }
    });
  } else {
    const infoCells = container.querySelectorAll('td.d2h-code-linenumber.d2h-info');
    infoCells.forEach((numCell, i) => {
      setupExpandCell(numCell, i === 0 ? '↑' : '↕');
    });
  }

  // Add ↓ button at the bottom of the file, matching the @@ info row structure
  if (isSxS) {
    const panels = container.querySelectorAll('.d2h-file-side-diff');
    panels.forEach((panel, panelIdx) => {
      const tb = panel.querySelector('tbody');
      if (!tb) return;
      const rows = Array.from(tb.querySelectorAll(':scope > tr'));
      if (!rows.length) return;
      const lastRow = rows[rows.length - 1];
      if (lastRow.querySelector('.d2h-info')) return;
      const expandRow = document.createElement('tr');
      const numTd = document.createElement('td');
      numTd.className = 'd2h-code-side-linenumber d2h-info';
      if (panelIdx === 0) {
        setupExpandCell(numTd, '↓');
      } else {
        numTd.innerHTML = '&nbsp;';
      }
      expandRow.appendChild(numTd);
      const codeTd = document.createElement('td');
      codeTd.className = 'd2h-info';
      codeTd.innerHTML = '&nbsp;';
      expandRow.appendChild(codeTd);
      tb.appendChild(expandRow);
    });
  } else {
    const tb = container.querySelector('tbody');
    if (tb) {
      const rows = Array.from(tb.querySelectorAll(':scope > tr'));
      if (rows.length) {
        const lastRow = rows[rows.length - 1];
        if (!lastRow.querySelector('.d2h-info')) {
          const expandRow = document.createElement('tr');
          const numTd = document.createElement('td');
          numTd.className = 'd2h-code-linenumber d2h-info';
          setupExpandCell(numTd, '↓');
          expandRow.appendChild(numTd);
          const codeTd = document.createElement('td');
          codeTd.className = 'd2h-info';
          expandRow.appendChild(codeTd);
          tb.appendChild(expandRow);
        }
      }
    }
  }
}

function detectSide(cell) {
  // Side-by-side: check which panel the cell is in
  const sidePanel = cell.closest('.d2h-file-side-diff');
  if (sidePanel) {
    const wrapper = sidePanel.closest('.d2h-file-wrapper');
    const panels = wrapper.querySelectorAll('.d2h-file-side-diff');
    return sidePanel === panels[0] ? 'left' : 'right';
  }
  // Unified: check if the cell is the old (first) or new (second) line number column
  const tr = cell.closest('tr');
  const lineNumCells = tr.querySelectorAll('td.d2h-code-linenumber');
  if (lineNumCells.length >= 2 && cell === lineNumCells[0]) return 'left';
  return 'right';
}

function buildLineMap(lines, which) {
  const map = {};
  let oldLine = 0, newLine = 0;
  lines.forEach(l => {
    if (l.startsWith('@@')) {
      const m = l.match(/@@ -(\d+)(?:,\d+)? \+(\d+)/);
      if (m) { oldLine = parseInt(m[1], 10) - 1; newLine = parseInt(m[2], 10) - 1; }
    } else if (l.startsWith('+')) {
      newLine++;
      if (which === 'new') map[newLine] = l.slice(1);
    } else if (l.startsWith('-')) {
      oldLine++;
      if (which === 'old') map[oldLine] = l.slice(1);
    } else {
      oldLine++;
      newLine++;
      map[which === 'old' ? oldLine : newLine] = l.slice(1);
    }
  });
  return map;
}

function findOppositeRow(tr) {
  const panel = tr.closest('.d2h-file-side-diff');
  if (!panel) return null;
  const wrapper = panel.closest('.d2h-file-wrapper');
  const panels = wrapper.querySelectorAll('.d2h-file-side-diff');
  const otherPanel = panel === panels[0] ? panels[1] : panels[0];
  const myRows = Array.from(panel.querySelectorAll('tbody > tr'));
  const otherRows = Array.from(otherPanel.querySelectorAll('tbody > tr'));
  const idx = myRows.indexOf(tr);
  return idx >= 0 && idx < otherRows.length ? otherRows[idx] : null;
}

function insertWithSpacer(tr, newRow) {
  const oppTr = findOppositeRow(tr);
  tr.after(newRow);
  if (oppTr) {
    const spacer = document.createElement('tr');
    spacer.className = 'revue-comment-row revue-spacer-row';
    spacer.innerHTML = `<td colspan="${oppTr.cells.length || 2}"></td>`;
    oppTr.after(spacer);
    const syncHeight = () => { spacer.style.height = newRow.offsetHeight + 'px'; };
    syncHeight();
    const ro = new ResizeObserver(syncHeight);
    ro.observe(newRow);
    // Store spacer ref for cleanup
    newRow._spacerRow = spacer;
    newRow._resizeObserver = ro;
  }
}

function showCommentInput(tr, file, line, lineContent, side, prefillText) {
  const inputRow = document.createElement('tr');
  inputRow.className = 'revue-input-row revue-comment-row';
  inputRow.dataset.file = file;
  inputRow.dataset.line = line;
  inputRow.dataset.side = side;
  inputRow.dataset.lineContent = lineContent;
  const colCount = tr.cells.length || 4;
  inputRow.innerHTML = `<td colspan="${colCount}"></td>`;
  const isSxS = !!tr.closest('.d2h-file-side-diff');
  if (isSxS) {
    insertWithSpacer(tr, inputRow);
  } else {
    tr.after(inputRow);
  }
  const td = inputRow.querySelector('td');
  const wrap = document.createElement('div');
  wrap.className = 'revue-comment-input-wrap';
  wrap.innerHTML = `
    <div style="font-size:0.6875rem;color:var(--text-dim)">Comment on line ${line}: <code style="color:var(--text)">${escHtml(lineContent.trim().slice(0,80))}</code></div>
    <textarea placeholder="Leave a comment…" autofocus></textarea>
    <div class="revue-comment-btn-row">
      <button class="revue-btn secondary cancel-btn">Cancel</button>
      <button class="revue-btn save-btn">Save Comment</button>
    </div>
  `;
  td.appendChild(wrap);
  const ta = wrap.querySelector('textarea');
  if (prefillText) ta.value = prefillText;
  ta.focus();

  const cleanup = () => {
    if (inputRow._resizeObserver) inputRow._resizeObserver.disconnect();
    if (inputRow._spacerRow) inputRow._spacerRow.remove();
    inputRow.remove();
  };
  wrap.querySelector('.cancel-btn').addEventListener('click', cleanup);
  wrap.querySelector('.save-btn').addEventListener('click', async () => {
    const body = wrap.querySelector('textarea').value.trim();
    if (!body) return;
    await apiPost('/api/comments', { file, line, line_content: lineContent, base: state.base, head: state.head, side, body, author: 'user' });
    await reloadComments();
    cleanup();
    renderFileList();
    await renderAllDiffs();
  });
}

// ── Commits panel ──────────────────────────────────────────────────────────

async function setupCommitsPanel() {
  const btn = document.getElementById('commits-btn');
  const panel = document.getElementById('commits-panel');
  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) await loadCommits();
  });
  document.addEventListener('click', () => panel.classList.remove('open'));
  panel.addEventListener('click', e => e.stopPropagation());
}

async function loadCommits() {
  const list = document.getElementById('commits-list');
  list.innerHTML = '<div style="padding:8px;color:var(--text-dim)">Loading…</div>';
  try {
    state.commits = await api(`/api/log?base=${encodeURIComponent(state.logBase)}&head=${encodeURIComponent(state.logHead)}`);
    renderCommitList();
  } catch(e) {
    list.innerHTML = `<div style="padding:8px;color:var(--text-dim)">Error: ${e.message}</div>`;
  }
}

function renderCommitList() {
  const list = document.getElementById('commits-list');
  const commits = state.commits || [];
  list.innerHTML = '';
  if (!commits.length) { list.innerHTML = '<div style="padding:8px;color:var(--text-dim)">No commits</div>'; return; }

  // Determine selected range indices
  let startIdx = -1, endIdx = -1;
  if (state.rangeStart) startIdx = commits.findIndex(c => c.hash === state.rangeStart);
  if (state.rangeEnd) endIdx = commits.findIndex(c => c.hash === state.rangeEnd);
  if (startIdx > endIdx && endIdx >= 0) { const t = startIdx; startIdx = endIdx; endIdx = t; }

  commits.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'commit-row';
    if (i === startIdx || i === endIdx) row.classList.add('selected');
    else if (startIdx >= 0 && endIdx >= 0 && i > startIdx && i < endIdx) row.classList.add('in-range');
    const isWorkingTree = c.hash === '~working~';
    row.innerHTML = `<span class="commit-hash">${isWorkingTree ? '✱' : escHtml(c.hash.slice(0, 8))}</span><span class="commit-subject" title="${escHtml(c.message)}">${escHtml(c.message)}</span>`;
    row.addEventListener('click', (e) => {
      e.preventDefault();
      if (e.shiftKey && !isWorkingTree) {
        window.getSelection()?.removeAllRanges();
        state.rangeEnd = c.hash;
      } else {
        state.rangeStart = c.hash;
        state.rangeEnd = null;
      }
      applyCommitRange();
      renderCommitList();
    });
    list.appendChild(row);
  });
}

function renderCommitRangeLabel() {
  const btn = document.getElementById('commits-btn');
  const label = document.getElementById('commit-range-label');
  if (!btn || !label) return;
  if (!state.rangeStart) {
    btn.classList.remove('range-active');
    label.className = '';
    label.innerHTML = '';
    return;
  }
  btn.classList.add('range-active');
  label.className = 'active';
  if (state.rangeStart === '~working~') {
    label.innerHTML = `Working tree <span class="range-clear" title="Clear selection">✕</span>`;
  } else if (!state.rangeEnd || state.rangeEnd === state.rangeStart) {
    label.innerHTML = `${state.rangeStart.slice(0, 8)} <span class="range-clear" title="Clear selection">✕</span>`;
  } else {
    const endLabel = state.rangeEnd === '~working~' ? 'Working tree' : state.rangeEnd.slice(0, 8);
    label.innerHTML = `${state.rangeStart.slice(0, 8)} → ${endLabel} <span class="range-clear" title="Clear selection">✕</span>`;
  }
  label.querySelector('.range-clear')?.addEventListener('click', (e) => {
    e.stopPropagation();
    state.rangeStart = null;
    state.rangeEnd = null;
    state.base = state.logBase;
    state.head = state.logHead;
    state.currentFile = null;
    renderCommitRangeLabel();
    writeHashFromState('push');
    loadFiles();
  });
}

function applyCommitRange() {
  const commits = state.commits || [];
  if (!state.rangeStart) return;

  // Normalize: state.rangeStart is the OLDER endpoint, state.rangeEnd the
  // NEWER. The user's click order doesn't necessarily reflect that, so we
  // swap when the picker put newer first. The hash writer relies on this
  // invariant so URL restoration can derive base/head deterministically.
  if (state.rangeEnd && state.rangeStart !== state.rangeEnd && state.rangeStart !== '~working~') {
    const si = commits.findIndex(c => c.hash === state.rangeStart);
    const ei = commits.findIndex(c => c.hash === state.rangeEnd);
    // commits are newest-first: higher index = older
    if (si >= 0 && ei >= 0 && si < ei) {
      const t = state.rangeStart; state.rangeStart = state.rangeEnd; state.rangeEnd = t;
    }
  }

  if (state.rangeStart === '~working~') {
    state.base = 'HEAD'; state.head = 'HEAD';
  } else if (!state.rangeEnd) {
    state.base = state.rangeStart + '^';
    state.head = state.rangeStart;
  } else {
    state.base = state.rangeStart + '^';
    state.head = state.rangeEnd === '~working~' ? 'HEAD' : state.rangeEnd;
  }

  renderCommitRangeLabel();
  document.getElementById('commits-panel').classList.remove('open');
  // Changing the commit range is a big context switch -- give it a back-button
  // entry so the user can step back to their previous range or branch view.
  state.currentFile = null;
  writeHashFromState('push');
  loadFiles();
}

// ── Helpers ────────────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function encodeFileId(file) {
  return file.replace(/[^a-zA-Z0-9_-]/g, '_');
}

// ── Boot ───────────────────────────────────────────────────────────────────
init().catch(e => {
  document.getElementById('diffview-content').innerHTML = `<div id="diffview-placeholder" style="color:#f47174">Failed to load: ${e.message}</div>`;
});
</script>
